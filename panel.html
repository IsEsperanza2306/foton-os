<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Foton · Panel Operativo 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --canvas:#071120; --surface:#0E1D33; --raised:#142744;
  --line:#1E3454; --line2:#2A4468;
  --tx:#E8EFF7; --mut:#7E93AC; --dim:#546A85;
  --brand:#2B7FD9;
  --c0:#B3261E; --c1:#D9502B; --c2:#E8912B; --c3:#2B7FD9; --c4:#1FA971;
  --purple:#9B6DD6;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--canvas)}
body{font-family:Inter,sans-serif;color:var(--tx);-webkit-font-smoothing:antialiased}
.mono{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}
.cond{font-family:'Barlow Condensed',sans-serif}

/* HEADER */
header{background:linear-gradient(180deg,#0B1B30,#071120);border-bottom:1px solid var(--line);
  padding:14px 24px;display:flex;align-items:center;gap:20px;position:sticky;top:0;z-index:50}
.logo{height:26px;width:auto;opacity:.95;flex-shrink:0}
.hdiv{width:1px;height:26px;background:var(--line2)}
.htitle .t1{font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:700;letter-spacing:.4px;line-height:1}
.htitle .t2{font-size:10px;color:var(--dim);letter-spacing:1.4px;font-weight:600;margin-top:3px}
.hspace{flex:1}
.rswitch{display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:3px}
.rbtn{padding:7px 15px;border:0;background:none;color:var(--mut);font-family:Inter;font-size:12px;
  font-weight:600;border-radius:6px;cursor:pointer;transition:.14s;white-space:nowrap}
.rbtn:hover{color:var(--tx)}
.rbtn.on{background:var(--brand);color:#fff}
.corte{font-size:10.5px;color:var(--dim);text-align:right;line-height:1.35;font-weight:500}
.corte b{color:var(--mut);display:block;font-size:11.5px;font-weight:600}
.refresh{width:34px;height:34px;border-radius:8px;border:1px solid var(--line2);background:var(--surface);
  color:var(--mut);cursor:pointer;font-size:14px;transition:.14s}
.refresh:hover{border-color:var(--brand);color:var(--brand)}
.refresh.load{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* TABS */
.tabbar{display:flex;gap:0;padding:0 24px;background:var(--canvas);border-bottom:1px solid var(--line);
  position:sticky;top:57px;z-index:49}
.tab{padding:13px 20px;border:0;background:none;color:var(--dim);font-family:Inter;font-size:13px;
  font-weight:600;cursor:pointer;border-bottom:2px solid transparent;transition:.14s;display:flex;
  align-items:center;gap:8px}
.tab:hover{color:var(--mut)}
.tab.on{color:var(--tx);border-bottom-color:var(--brand)}
.tbadge{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;padding:2px 6px;
  border-radius:5px;background:var(--raised);color:var(--mut)}
.tab.on .tbadge{background:var(--brand);color:#fff}

main{padding:22px 24px 60px;max-width:1500px;margin:0 auto}

/* HEADLINE */
.headline{background:linear-gradient(135deg,#0F2340,#0B1A2E);border:1px solid var(--line2);
  border-radius:13px;padding:20px 24px;margin-bottom:14px;display:flex;align-items:center;gap:24px}
.hl-bar{width:3px;align-self:stretch;border-radius:2px;background:var(--brand);flex-shrink:0}
.hl-txt{flex:1}
.hl-main{font-family:'Barlow Condensed',sans-serif;font-size:25px;font-weight:700;line-height:1.15;letter-spacing:.2px}
.hl-main em{font-style:normal;color:var(--brand)}
.hl-main .bad{color:var(--c1)}
.hl-sub{font-size:12.5px;color:var(--mut);margin-top:5px;line-height:1.45}
.hl-sub b{color:var(--tx);font-weight:600}

/* GRID SUMMARY */
.msum{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:14px 16px;
  position:relative;overflow:hidden}
.mcard-top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:9px}
.mcard-mod{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:800;letter-spacing:.5px}
.mcard-pct{font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:700}
.mcard-bar{height:5px;background:#0A1830;border-radius:3px;overflow:hidden;margin-bottom:9px}
.mcard-fill{height:100%;border-radius:3px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.mcard-nums{display:flex;justify-content:space-between;font-size:10px;color:var(--dim);font-weight:500}
.mcard-nums b{font-family:'JetBrains Mono',monospace;color:var(--mut);font-weight:600;display:block;
  font-size:12px;margin-top:1px}

/* SECTION */
.sec{margin-bottom:16px}
.sec-h{display:flex;align-items:baseline;gap:10px;margin-bottom:9px;padding:0 2px}
.sec-h h3{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;
  text-transform:uppercase;letter-spacing:1.1px;color:var(--mut)}
.sec-h span{font-size:11px;color:var(--dim)}
.sec-h .spacer{flex:1}

/* PANEL */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}

/* ACTION LIST */
.act{display:grid;grid-template-columns:26px 1fr 52px 132px 74px;align-items:center;gap:12px;
  padding:11px 18px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .12s}
.act:last-child{border-bottom:0}
.act:hover{background:var(--raised)}
.act-i{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--dim);font-weight:600}
.act-d{font-size:13px;font-weight:600;letter-spacing:.1px}
.act-r{font-size:10px;color:var(--dim);margin-top:2px;font-weight:500}
.act-m{font-family:'Barlow Condensed',sans-serif;font-size:21px;font-weight:800;text-align:center}
.act-bar{height:5px;background:#0A1830;border-radius:3px;overflow:hidden;margin-bottom:4px}
.act-fill{height:100%;border-radius:3px}
.act-lbl{font-size:9.5px;color:var(--dim);font-weight:500}
.act-lbl b{font-family:'JetBrains Mono',monospace;color:var(--mut)}
.act-g{text-align:right}
.act-gn{font-family:'JetBrains Mono',monospace;font-size:17px;font-weight:700}
.act-gl{font-size:9px;color:var(--dim);font-weight:600;letter-spacing:.3px}

/* MATRIX */
.mtx-wrap{overflow-x:auto}
.mtx{width:100%;border-collapse:separate;border-spacing:0}
.mtx th{position:sticky;top:0;background:var(--raised);font-size:10px;font-weight:700;color:var(--mut);
  text-transform:uppercase;letter-spacing:.9px;padding:9px 6px;text-align:center;border-bottom:1px solid var(--line2)}
.mtx th:first-child{text-align:left;padding-left:18px;min-width:180px}
.mtx th.mh{font-family:'Barlow Condensed',sans-serif;font-size:16px;letter-spacing:.5px;color:var(--tx);width:88px}
.mtx td{padding:0;border-bottom:1px solid var(--line)}
.mtx tr:last-child td{border-bottom:0}
.mtx tr:hover td{background:rgba(43,127,217,.05)}
.mtx-d{padding:0 18px;font-size:12.5px;font-weight:600;white-space:nowrap}
.mtx-dr{font-size:9.5px;color:var(--dim);font-weight:500;margin-top:1px}
.cell{margin:3px;height:38px;border-radius:6px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;cursor:pointer;transition:.14s;border:1px solid transparent;position:relative}
.cell:hover{transform:scale(1.06);border-color:rgba(255,255,255,.3);z-index:2}
.cell-p{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;line-height:1}
.cell-g{font-size:8.5px;font-weight:600;opacity:.75;margin-top:2px;letter-spacing:.2px}
.cell.na{background:#0A1830;cursor:default}
.cell.na:hover{transform:none;border-color:transparent}
.cell.na .cell-p{color:#2A3E58;font-size:11px}

/* LEGEND */
.legend{display:flex;align-items:center;gap:14px;padding:11px 18px;border-top:1px solid var(--line);
  font-size:10.5px;color:var(--dim);flex-wrap:wrap}
.lg{display:flex;align-items:center;gap:6px;font-weight:500}
.lgc{width:13px;height:13px;border-radius:4px}

/* AGING */
.aging{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.agc{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:15px 17px;
  border-left:3px solid var(--line2)}
.agc.b1{border-left-color:var(--c3)}
.agc.b2{border-left-color:var(--c2)}
.agc.b3{border-left-color:var(--c1)}
.agc.b4{border-left-color:var(--c0)}
.agc-l{font-size:10px;color:var(--dim);font-weight:700;letter-spacing:.9px;text-transform:uppercase}
.agc-n{font-family:'Barlow Condensed',sans-serif;font-size:38px;font-weight:800;line-height:1;margin:5px 0 3px}
.agc-s{font-size:10.5px;color:var(--mut);font-weight:500}
.agc-s b{font-family:'JetBrains Mono',monospace}

/* COB DEALER */
.cd{border-bottom:1px solid var(--line)}
.cd:last-child{border-bottom:0}
.cd-h{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:16px;padding:13px 18px;
  cursor:pointer;transition:background .12s}
.cd-h:hover{background:var(--raised)}
.cd-n{font-size:13.5px;font-weight:600}
.cd-r{font-size:10px;color:var(--dim);margin-top:2px;font-weight:500}
.cd-pills{display:flex;gap:6px}
.pill{display:flex;align-items:center;gap:5px;padding:4px 9px;border-radius:6px;font-size:11px;font-weight:700}
.pill .mono{font-size:12px}
.pill.c{background:rgba(179,38,30,.18);color:#FF7A6E}
.pill.u{background:rgba(232,145,43,.16);color:#FFB55C}
.pill.a{background:rgba(155,109,214,.16);color:#C4A0F0}
.cd-max{text-align:right;min-width:66px}
.cd-maxn{font-family:'JetBrains Mono',monospace;font-size:19px;font-weight:700}
.cd-maxl{font-size:9px;color:var(--dim);font-weight:600;letter-spacing:.3px}
.cd-body{max-height:0;overflow:hidden;transition:max-height .32s ease}
.cd-body.open{max-height:2600px}
.cd-inner{padding:0 18px 12px;border-top:1px solid var(--line)}
.ur{display:grid;grid-template-columns:56px 46px 1fr auto;align-items:center;gap:13px;padding:9px 0;
  border-bottom:1px solid rgba(30,52,84,.5)}
.ur:last-child{border-bottom:0}
.ur-d{text-align:center}
.ur-dn{font-family:'JetBrains Mono',monospace;font-size:17px;font-weight:700;line-height:1}
.ur-dl{font-size:8px;color:var(--dim);font-weight:600;letter-spacing:.2px}
.ur-m{font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:800;text-align:center}
.ur-i{font-size:11px;color:var(--mut)}
.ur-i b{color:var(--tx);font-weight:600}
.ur-f{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--dim);margin-top:2px}
.ur-s{font-size:10px;font-weight:700;padding:3px 9px;border-radius:5px;white-space:nowrap}
.ur-s.critico{background:rgba(179,38,30,.18);color:#FF7A6E}
.ur-s.urgente{background:rgba(232,145,43,.16);color:#FFB55C}
.ur-s.anticipo{background:rgba(155,109,214,.16);color:#C4A0F0}

/* MODAL */
.modal{display:none;position:fixed;inset:0;background:rgba(3,9,18,.8);backdrop-filter:blur(6px);
  z-index:100;align-items:center;justify-content:center;padding:24px}
.modal.on{display:flex}
.mbox{background:var(--surface);border:1px solid var(--line2);border-radius:14px;max-width:560px;width:100%;
  max-height:80vh;overflow:auto}
.mbox-h{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;
  justify-content:space-between;position:sticky;top:0;background:var(--surface)}
.mbox-t{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700}
.mbox-s{font-size:11px;color:var(--dim);margin-top:2px}
.mx{width:28px;height:28px;border-radius:7px;border:1px solid var(--line2);background:none;color:var(--mut);
  cursor:pointer;font-size:15px}
.mx:hover{border-color:var(--c1);color:var(--c1)}
.mbox-b{padding:18px 22px}
.mstat{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:16px}
.ms{background:var(--raised);border-radius:9px;padding:11px 13px;text-align:center}
.ms-n{font-family:'JetBrains Mono',monospace;font-size:19px;font-weight:700}
.ms-l{font-size:9px;color:var(--dim);font-weight:600;letter-spacing:.4px;margin-top:2px;text-transform:uppercase}
.fr{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--line);font-size:11.5px}
.fr:last-child{border-bottom:0}
.fr-f{font-family:'JetBrains Mono',monospace;font-weight:600;color:var(--brand);font-size:11px}
.fr-m{flex:1;color:var(--mut)}
.fr-d{font-family:'JetBrains Mono',monospace;color:var(--dim);font-size:10.5px}

.empty{padding:38px;text-align:center;color:var(--dim);font-size:12.5px}
.empty b{display:block;color:var(--c4);font-size:15px;margin-bottom:5px;font-family:'Barlow Condensed',sans-serif}

.overlay{display:none;position:fixed;inset:0;background:rgba(7,17,32,.75);backdrop-filter:blur(3px);
  z-index:200;align-items:center;justify-content:center}
.overlay.on{display:flex}
.spin{width:36px;height:36px;border:2.5px solid rgba(43,127,217,.2);border-top-color:var(--brand);
  border-radius:50%;animation:spin .7s linear infinite}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(90px);background:var(--raised);
  border:1px solid var(--line2);color:var(--tx);padding:11px 20px;border-radius:9px;font-size:12.5px;
  font-weight:500;z-index:300;transition:transform .3s cubic-bezier(.4,0,.2,1);box-shadow:0 8px 28px rgba(0,0,0,.5)}
.toast.on{transform:translateX(-50%) translateY(0)}

@media(max-width:1100px){
  .msum{grid-template-columns:repeat(3,1fr)}
  .aging{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:760px){
  header{flex-wrap:wrap;gap:12px;padding:12px 16px}
  .hspace{display:none}
  .rswitch{order:3;width:100%}
  .rbtn{flex:1}
  main{padding:16px 14px 50px}
  .msum{grid-template-columns:repeat(2,1fr)}
  .hl-main{font-size:20px}
  .act{grid-template-columns:1fr 44px 66px;gap:10px}
  .act-i,.act-bar,.act-lbl{display:none}
  .tabbar{padding:0 14px;top:auto;position:relative}
}
</style>
</head>

async function q(p){const r=await fetch(SB+p,{headers:H});if(!r.ok)throw new Error(r.status);return r.json()}
function toast(m,e){const t=document.getElementById('toast');t.textContent=(e?'\u2715 ':'\u2713 ')+m;
  t.classList.add('on');setTimeout(()=>t.classList.remove('on'),3200)}

/* escala de cobertura */
function covColor(p){
  if(p>=100)return'#1FA971'; if(p>=75)return'#2B7FD9';
  if(p>=50)return'#E8912B';  if(p>=25)return'#D9502B'; return'#B3261E';
}
function covBg(p){
  if(p>=100)return'rgba(31,169,113,.20)'; if(p>=75)return'rgba(43,127,217,.20)';
  if(p>=50)return'rgba(232,145,43,.18)';  if(p>=25)return'rgba(217,80,43,.20)';
  return'rgba(179,38,30,.24)';
}
function diasColor(d){ if(d>=60)return'#B3261E'; if(d>=31)return'#D9502B'; if(d>=16)return'#E8912B'; return'#2B7FD9' }

async function cargar(){
  const [dls,cob,bo,bp,fac]=await Promise.all([
    q('/distribuidores?region=in.(israel,marco)&select=id,nombre,region'),
    q('/cobranza_2026?anio=eq.2026&select=distribuidor_id,region,folio,vin,modelo,familia,f_factura,f_liberacion,f_entrega,estado,dias_alerta,dias_src&order=dias_alerta.desc'),
    q('/back_order?select=distribuidor_id,modelo,modelo_familia,unidades,fecha_solicitud,notas'),
    q('/bp_anual?anio=eq.2026&select=distribuidor_id,modelo,unidades_bp'),
    q('/facturado_ytd?anio=eq.2026&select=distribuidor_id,mes,modelo,unidades_facturadas')
  ]);
  DL={}; dls.forEach(d=>DL[d.id]={nombre:d.nombre,region:d.region});
  COB=cob; BOR=bo; BP=bp; FAC=fac;

  const mx=cob.reduce((a,r)=>{const p=(r.f_factura||'').split('/');if(p.length!==3)return a;
    const t=new Date(+p[2],+p[1]-1,+p[0]).getTime();return t>a.t?{t,s:r.f_factura}:a},{t:0,s:''});
  document.getElementById('corte1').textContent='Corte '+(mx.s||'—');
  document.getElementById('corte2').textContent='Actualizado '+new Date().toLocaleDateString('es-MX',{day:'2-digit',month:'short'});
  render();
}

function dealersReg(){return Object.keys(DL).filter(id=>REG==='all'||DL[id].region===REG)}

function buildMatrix(){
  const ids=dealersReg();
  const bpM={},facM={},boM={},boF={};
  BP.forEach(r=>{const k=r.distribuidor_id+'|'+r.modelo;bpM[k]=(bpM[k]||0)+r.unidades_bp});
  FAC.forEach(r=>{const k=r.distribuidor_id+'|'+r.modelo;facM[k]=(facM[k]||0)+r.unidades_facturadas});
  BOR.forEach(r=>{const f=r.modelo_familia||MODS.find(m=>(r.modelo||'').includes(m));if(!f)return;
    const k=r.distribuidor_id+'|'+f;boM[k]=(boM[k]||0)+(r.unidades||1);
    (boF[k]=boF[k]||[]).push({modelo:r.modelo,fecha:r.fecha_solicitud||'',notas:r.notas||''})});
  MATRIX=[];
  ids.forEach(did=>MODS.forEach(m=>{
    const k=did+'|'+m, bp=bpM[k]||0, fac=facM[k]||0, bo=boM[k]||0;
    const cov=bp>0?((fac+bo)/bp*100):null;
    MATRIX.push({did,modelo:m,bp,fac,bo,cov,gap:Math.max(0,bp-fac-bo),folios:boF[k]||[]});
  }));
}

function render(){buildMatrix();renderCob();renderBO();
  const al=COB.filter(r=>rMatch(r.distribuidor_id)&&['critico','urgente','anticipo'].includes(r.estado)).length;
  const sinbo=MATRIX.filter(r=>r.bp>0&&r.bo===0&&r.gap>0).length;
  document.getElementById('bcob').textContent=al;
  document.getElementById('bbo').textContent=sinbo;
}
function rMatch(did){return REG==='all'||(DL[did]&&DL[did].region===REG)}

/* ══ COBRANZA ══ */
function renderCob(){
  const al=COB.filter(r=>rMatch(r.distribuidor_id)&&['critico','urgente','anticipo'].includes(r.estado));
  if(!al.length){document.getElementById('pane-cob').innerHTML=
    '<div class="panel"><div class="empty"><b>Sin adeudos pendientes</b>Toda la cartera de la región está al corriente.</div></div>';return}

  const b1=al.filter(r=>r.dias_alerta<=15), b2=al.filter(r=>r.dias_alerta>15&&r.dias_alerta<=30);
  const b3=al.filter(r=>r.dias_alerta>30&&r.dias_alerta<=60), b4=al.filter(r=>r.dias_alerta>60);
  const prom=Math.round(al.reduce((s,r)=>s+r.dias_alerta,0)/al.length);
  const crit=al.filter(r=>r.estado==='critico').length;
  const viejo=al.reduce((m,r)=>Math.max(m,r.dias_alerta),0);
  const nD=new Set(al.map(r=>r.distribuidor_id)).size;

  let hl;
  if(b4.length) hl='<em>'+al.length+'</em> unidades sin pago &mdash; <span class="bad">'+b4.length+' rebasan 60 días</span>';
  else if(crit) hl='<em>'+al.length+'</em> unidades sin pago &mdash; <span class="bad">'+crit+' ya entregadas</span>';
  else hl='<em>'+al.length+'</em> unidades sin pago en la region';

  const grupos={};
  al.forEach(r=>{(grupos[r.distribuidor_id]=grupos[r.distribuidor_id]||[]).push(r)});
  const orden=Object.entries(grupos).sort((a,b)=>{
    const sc=g=>g.filter(x=>x.estado==='critico').length*1000+Math.max(...g.map(x=>x.dias_alerta));
    return sc(b[1])-sc(a[1])});

  const filas=orden.map(([did,us])=>{
    const c=us.filter(x=>x.estado==='critico').length;
    const u=us.filter(x=>x.estado==='urgente').length;
    const a=us.filter(x=>x.estado==='anticipo').length;
    const mx=Math.max(...us.map(x=>x.dias_alerta));
    const ord=us.sort((x,y)=>({critico:0,urgente:1,anticipo:2}[x.estado]-{critico:0,urgente:1,anticipo:2}[y.estado])||y.dias_alerta-x.dias_alerta);
    return '<div class="cd">'+
      '<div class="cd-h" onclick="tog(this)">'+
        '<div><div class="cd-n">'+(DL[did]?DL[did].nombre:did)+'</div>'+
        '<div class="cd-r">'+us.length+' unidades pendientes</div></div>'+
        '<div class="cd-pills">'+
          (c?'<span class="pill c"><span class="mono">'+c+'</span> entregadas</span>':'')+
          (u?'<span class="pill u"><span class="mono">'+u+'</span> liberadas</span>':'')+
          (a?'<span class="pill a"><span class="mono">'+a+'</span> anticipo</span>':'')+
        '</div>'+
        '<div class="cd-max"><div class="cd-maxn" style="color:'+diasColor(mx)+'">'+mx+'d</div>'+
        '<div class="cd-maxl">MÁS ANTIGUA</div></div>'+
      '</div>'+
      '<div class="cd-body"><div class="cd-inner">'+ord.map(r=>{
        const lb={critico:'Entregada sin pago',urgente:'Liberada sin pago',anticipo:'Anticipo parcial'}[r.estado];
        const src=r.dias_src==='lib'?'desde liberación':'desde factura';
        return '<div class="ur">'+
          '<div class="ur-d"><div class="ur-dn" style="color:'+diasColor(r.dias_alerta)+'">'+r.dias_alerta+'</div>'+
          '<div class="ur-dl">DÍAS</div></div>'+
          '<div class="ur-m">'+(r.familia||'')+'</div>'+
          '<div class="ur-i"><b>'+src+'</b>'+
            '<div class="ur-f">'+(r.folio||'')+' &middot; '+(r.f_liberacion||r.f_factura||'')+'</div></div>'+
          '<div class="ur-s '+r.estado+'">'+lb+'</div>'+
        '</div>'}).join('')+
      '</div></div></div>'}).join('');

  document.getElementById('pane-cob').innerHTML=
    '<div class="headline"><div class="hl-bar" style="background:'+(b4.length?'#B3261E':'#E8912B')+'"></div>'+
      '<div class="hl-txt"><div class="hl-main">'+hl+'</div>'+
      '<div class="hl-sub">Promedio de <b>'+prom+' días</b> sin cobrar &middot; la más antigua lleva <b>'+viejo+' días</b> &middot; '+
      'concentradas en <b>'+nD+' distribuidores</b></div></div></div>'+
    '<div class="aging">'+
      ag('b1','1 &ndash; 15 días',b1,al.length)+ag('b2','16 &ndash; 30 días',b2,al.length)+
      ag('b3','31 &ndash; 60 días',b3,al.length)+ag('b4','Más de 60 días',b4,al.length)+
    '</div>'+
    '<div class="sec"><div class="sec-h"><h3>Cartera por distribuidor</h3>'+
      '<span>ordenada por severidad</span><div class="spacer"></div>'+
      '<span>clic para ver el detalle</span></div>'+
      '<div class="panel">'+filas+'</div></div>';
}
function ag(cls,lbl,arr,tot){
  const p=tot?Math.round(arr.length/tot*100):0;
  const col={b1:'#2B7FD9',b2:'#E8912B',b3:'#D9502B',b4:'#B3261E'}[cls];
  return '<div class="agc '+cls+'"><div class="agc-l">'+lbl+'</div>'+
    '<div class="agc-n" style="color:'+(arr.length?col:'#2A3E58')+'">'+arr.length+'</div>'+
    '<div class="agc-s"><b>'+p+'%</b> de la cartera</div></div>'}
function tog(el){el.nextElementSibling.classList.toggle('open')}

/* ══ BACK ORDER ══ */
function renderBO(){
  const rows=MATRIX.filter(r=>r.bp>0);
  if(!rows.length){document.getElementById('pane-bo').innerHTML=
    '<div class="panel"><div class="empty"><b>Sin Business Plan cargado</b>No hay BP registrado para esta región.</div></div>';return}

  const act=MATRIX.filter(r=>r.bp>0||r.fac>0||r.bo>0);
  const tot={};
  MODS.forEach(m=>{const s=act.filter(r=>r.modelo===m);
    const bp=s.reduce((a,r)=>a+r.bp,0), fac=s.reduce((a,r)=>a+r.fac,0), bo=s.reduce((a,r)=>a+r.bo,0);
    tot[m]={bp,fac,bo,cov:bp?((fac+bo)/bp*100):0,gap:Math.max(0,bp-fac-bo)}});

  const TB=Object.values(tot).reduce((a,t)=>a+t.bp,0);
  const TF=Object.values(tot).reduce((a,t)=>a+t.fac,0);
  const TO=Object.values(tot).reduce((a,t)=>a+t.bo,0);
  const TG=Object.values(tot).reduce((a,t)=>a+t.gap,0);
  const TC=TB?((TF+TO)/TB*100):0;
  const peor=MODS.filter(m=>tot[m].bp>0).sort((a,b)=>tot[a].cov-tot[b].cov)[0];

  const cards=MODS.map(m=>{const t=tot[m];
    if(!t.bp)return '<div class="mcard" style="opacity:.4"><div class="mcard-top">'+
      '<div class="mcard-mod" style="color:#2A3E58">'+m+'</div></div>'+
      '<div class="mcard-nums" style="color:#2A3E58">sin BP</div></div>';
    return '<div class="mcard"><div class="mcard-top">'+
      '<div class="mcard-mod">'+m+'</div>'+
      '<div class="mcard-pct" style="color:'+covColor(t.cov)+'">'+Math.round(t.cov)+'%</div></div>'+
      '<div class="mcard-bar"><div class="mcard-fill" style="width:'+Math.min(100,t.cov)+'%;background:'+covColor(t.cov)+'"></div></div>'+
      '<div class="mcard-nums">'+
        '<span>BP<b>'+t.bp+'</b></span><span>Fact<b>'+t.fac+'</b></span>'+
        '<span>BO<b>'+t.bo+'</b></span>'+
        '<span>Falta<b style="color:'+(t.gap?'#FF7A6E':'#1FA971')+'">'+t.gap+'</b></span>'+
      '</div></div>'}).join('');

  const acc=rows.filter(r=>r.gap>0).sort((a,b)=>(a.bo===0?0:1)-(b.bo===0?0:1)||b.gap-a.gap).slice(0,10);
  const accH=acc.map((r,i)=>
    '<div class="act" onclick="verCelda(\''+r.did+'\',\''+r.modelo+'\')">'+
      '<div class="act-i">'+String(i+1).padStart(2,'0')+'</div>'+
      '<div><div class="act-d">'+(DL[r.did]?DL[r.did].nombre:r.did)+'</div>'+
      '<div class="act-r">'+(r.bo===0?'Sin ningún pedido colocado':r.bo+' unidades ya pedidas')+'</div></div>'+
      '<div class="act-m" style="color:'+covColor(r.cov)+'">'+r.modelo+'</div>'+
      '<div><div class="act-bar"><div class="act-fill" style="width:'+Math.min(100,r.cov)+'%;background:'+covColor(r.cov)+'"></div></div>'+
      '<div class="act-lbl">Fact <b>'+r.fac+'</b> + BO <b>'+r.bo+'</b> de <b>'+r.bp+'</b></div></div>'+
      '<div class="act-g"><div class="act-gn" style="color:'+covColor(r.cov)+'">'+Math.round(r.cov)+'%</div>'+
      '<div class="act-gl">CUBIERTO</div></div>'+
    '</div>').join('');

  const ids=dealersReg().sort((a,b)=>{
    const c=d=>{const s=rows.filter(r=>r.did===d);return s.length?s.reduce((x,r)=>x+r.cov,0)/s.length:999};
    return c(a)-c(b)});
  const mtxH=ids.map(did=>{
    const cells=MODS.map(m=>{
      const r=MATRIX.find(x=>x.did===did&&x.modelo===m);
      if(!r||(!r.bp&&!r.fac&&!r.bo))return '<td><div class="cell na"><div class="cell-p">&mdash;</div></div></td>';
      if(!r.bp)return '<td><div class="cell na" style="cursor:pointer" onclick="verCelda(\''+did+'\',\''+m+'\')">'+
        '<div class="cell-p" style="color:#7E93AC;font-size:12px">'+(r.fac+r.bo)+'</div>'+
        '<div class="cell-g" style="color:#546A85">sin plan</div></div></td>';
      return '<td><div class="cell" style="background:'+covBg(r.cov)+'" onclick="verCelda(\''+did+'\',\''+m+'\')">'+
        '<div class="cell-p" style="color:'+covColor(r.cov)+'">'+Math.round(r.cov)+'%</div>'+
        (r.gap?'<div class="cell-g" style="color:'+covColor(r.cov)+'">faltan '+r.gap+'</div>':
               '<div class="cell-g" style="color:#1FA971">completo</div>')+
        '</div></td>'}).join('');
    return '<tr><td class="mtx-d"><div>'+(DL[did]?DL[did].nombre:did)+'</div>'+
      (REG==='all'?'<div class="mtx-dr">'+(DL[did].region==='israel'?'Centro-Sur':'Noroeste / Pacífico')+'</div>':'')+
      '</td>'+cells+'</tr>'}).join('');

  document.getElementById('pane-bo').innerHTML=
    '<div class="headline"><div class="hl-bar" style="background:'+covColor(TC)+'"></div>'+
      '<div class="hl-txt"><div class="hl-main">'+RNOM[REG]+' tiene <em>'+Math.round(TC)+'%</em> de su plan cubierto'+
      (peor?' &mdash; <span class="bad">'+peor+' es el hueco más grande</span>':'')+'</div>'+
      '<div class="hl-sub">Business Plan de <b>'+TB+' unidades</b> &middot; <b>'+TF+'</b> facturadas y <b>'+TO+'</b> en back order &middot; '+
      'quedan <b>'+TG+' unidades</b> por colocar'+
      (peor?' &middot; '+peor+' solo tiene <b>'+Math.round(tot[peor].cov)+'%</b> cubierto':'')+
      '</div></div></div>'+
    '<div class="msum">'+cards+'</div>'+
    (acc.length?'<div class="sec"><div class="sec-h"><h3>Decisiones pendientes</h3>'+
      '<span>los '+acc.length+' huecos más grandes</span><div class="spacer"></div>'+
      '<span>clic para ver los pedidos</span></div>'+
      '<div class="panel">'+accH+'</div></div>':'')+
    '<div class="sec"><div class="sec-h"><h3>Cobertura por distribuidor y modelo</h3>'+
      '<span>'+ids.length+' distribuidores</span><div class="spacer"></div>'+
      '<span>menor cobertura primero</span></div>'+
      '<div class="panel"><div class="mtx-wrap"><table class="mtx"><thead><tr><th>Distribuidor</th>'+
      MODS.map(m=>'<th class="mh">'+m+'</th>').join('')+'</tr></thead><tbody>'+mtxH+'</tbody></table></div>'+
      '<div class="legend"><span style="font-weight:600;color:var(--mut)">Cobertura del BP:</span>'+
        '<span class="lg"><span class="lgc" style="background:rgba(179,38,30,.24)"></span>menos de 25%</span>'+
        '<span class="lg"><span class="lgc" style="background:rgba(217,80,43,.20)"></span>25 a 50%</span>'+
        '<span class="lg"><span class="lgc" style="background:rgba(232,145,43,.18)"></span>50 a 75%</span>'+
        '<span class="lg"><span class="lgc" style="background:rgba(43,127,217,.20)"></span>75 a 100%</span>'+
        '<span class="lg"><span class="lgc" style="background:rgba(31,169,113,.20)"></span>plan completo</span>'+
      '</div></div></div>';
}

function verCelda(did,mod){
  const r=MATRIX.find(x=>x.did===did&&x.modelo===mod); if(!r)return;
  const fol=r.folios.length?r.folios.map(f=>{
    const pl=(f.notas.match(/Plaza ([^|]+)/)||[])[1]||'';
    const fo=(f.notas.match(/Folio ([^|]+)/)||[])[1]||'';
    return '<div class="fr"><span class="fr-f">'+fo.trim()+'</span>'+
      '<span class="fr-m">'+f.modelo+(pl?' &middot; '+pl.trim():'')+'</span>'+
      '<span class="fr-d">'+(f.fecha||'')+'</span></div>'}).join('')
    :'<div class="empty" style="padding:22px">Sin pedidos colocados para este modelo.</div>';
  document.getElementById('mbox').innerHTML=
    '<div class="mbox-h"><div><div class="mbox-t">'+(DL[did]?DL[did].nombre:did)+' &middot; '+mod+'</div>'+
    '<div class="mbox-s">'+Math.round(r.cov)+'% del plan cubierto</div></div>'+
    '<button class="mx" onclick="cerrarModal()">&times;</button></div>'+
    '<div class="mbox-b"><div class="mstat">'+
      '<div class="ms"><div class="ms-n">'+r.bp+'</div><div class="ms-l">Plan</div></div>'+
      '<div class="ms"><div class="ms-n" style="color:#2B7FD9">'+r.fac+'</div><div class="ms-l">Facturado</div></div>'+
      '<div class="ms"><div class="ms-n" style="color:#1FA971">'+r.bo+'</div><div class="ms-l">En pedido</div></div>'+
      '<div class="ms"><div class="ms-n" style="color:'+(r.gap?'#FF7A6E':'#1FA971')+'">'+r.gap+'</div><div class="ms-l">Falta</div></div>'+
    '</div><div class="sec-h" style="margin-bottom:4px"><h3>Pedidos registrados</h3></div>'+fol+'</div>';
  document.getElementById('modal').classList.add('on');
}
function cerrarModal(){document.getElementById('modal').classList.remove('on')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')cerrarModal()});

function setTab(t){TAB=t;
  document.getElementById('tab-cob').classList.toggle('on',t==='cob');
  document.getElementById('tab-bo').classList.toggle('on',t==='bo');
  document.getElementById('pane-cob').style.display=t==='cob'?'':'none';
  document.getElementById('pane-bo').style.display=t==='bo'?'':'none';
}
function setRegion(r){REG=r;
  document.querySelectorAll('.rbtn').forEach(b=>b.classList.toggle('on',b.dataset.r===r));
  document.getElementById('reglbl').textContent=RLBL[r]+' \u00b7 '+RSUB[r];
  render();window.scrollTo({top:0,behavior:'smooth'});
}
async function actualizar(){
  const b=document.getElementById('btnr');
  document.getElementById('ov').classList.add('on'); b.classList.add('load');
  try{await cargar();toast('Datos actualizados')}catch(e){toast('Error al actualizar',1)}
  finally{document.getElementById('ov').classList.remove('on');b.classList.remove('load')}
}

document.getElementById('reglbl').textContent=RLBL.israel+' \u00b7 '+RSUB.israel;
document.getElementById('ov').classList.add('on');
cargar().then(()=>document.getElementById('ov').classList.remove('on'))
  .catch(e=>{document.getElementById('ov').classList.remove('on');toast('Error: '+e.message,1)});
</script>
</body>
</html>
