<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Foton · Panel Operativo 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#042C53;--blue:#185FA5;--line:#E2EBF5;--bg:#F4F7FB;--ink:#1B2733;--mut:#697A8D;
  --red:#C0392B;--red-bg:#FBEAE7;--orange:#D35400;--orange-bg:#FEF0E6;
  --purple:#7D3C98;--purple-bg:#F5EEF8;--green:#1A7A4A;--green-bg:#EAF7EE;--gray-bg:#F0F3F7;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
header{background:linear-gradient(120deg,var(--navy),#1056A0);padding:0 28px;display:flex;align-items:center;gap:16px;min-height:64px}
.h-brand h1{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:800;color:#fff;text-transform:uppercase;letter-spacing:.5px}
.h-brand p{font-size:11px;color:rgba(255,255,255,.6);margin-top:2px}
.h-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.h-corte{font-size:12px;color:rgba(255,255,255,.7);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;background:#2ECC71;border-radius:50%;animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.btn-update{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;padding:8px 16px;border-radius:8px;font-size:12.5px;font-weight:700;cursor:pointer;transition:.2s;font-family:'Inter'}
.btn-update:hover{background:rgba(255,255,255,.22)}
.btn-update.loading{opacity:.7;pointer-events:none}
.spin{display:none;animation:spin .8s linear infinite}
.btn-update.loading .spin{display:inline}
.btn-update.loading .ico{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
.tabs{display:flex;background:#fff;border-bottom:1px solid var(--line);padding:0 24px}
.tab{padding:14px 22px;font-size:13px;font-weight:600;color:var(--mut);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:8px;transition:.15s;white-space:nowrap}
.tab.on{color:var(--navy);border-bottom-color:var(--blue)}
.tbadge{background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;line-height:1.4}
.tbadge.g{background:var(--green)}
.wrap{max-width:1280px;margin:0 auto;padding:24px 20px 80px}
.pane{display:none}.pane.on{display:block}
.alert-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:28px}
.astrip{border-radius:16px;padding:20px 22px;display:flex;flex-direction:column;gap:6px}
.astrip.red{background:var(--red);color:#fff}
.astrip.orange{background:var(--orange);color:#fff}
.astrip.purple{background:var(--purple);color:#fff}
.astrip-num{font-family:'Barlow Condensed',sans-serif;font-size:56px;font-weight:800;line-height:1}
.astrip-lbl{font-size:14px;font-weight:700;opacity:.9}
.astrip-sub{font-size:12px;opacity:.7}
.section-lbl{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.3px;margin:28px 0 14px;padding-bottom:8px;border-bottom:2px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.section-lbl .cnt{font-family:'Inter';font-size:12px;font-weight:600;color:var(--mut)}
.dcob-card{background:#fff;border:1.5px solid var(--line);border-radius:16px;margin-bottom:14px;overflow:hidden}
.dcob-card.has-critico{border-top:4px solid var(--red)}
.dcob-card.has-urgente{border-top:4px solid var(--orange)}
.dcob-card.has-anticipo{border-top:4px solid var(--purple)}
.dcob-head{padding:16px 20px;display:flex;align-items:center;gap:14px;cursor:pointer;user-select:none}
.dcob-head:hover{background:#FAFCFE}
.dcob-name{font-size:16px;font-weight:700;color:var(--navy);flex:1}
.dcob-badges{display:flex;gap:8px}
.dbadge{display:flex;flex-direction:column;align-items:center;padding:6px 14px;border-radius:10px;min-width:54px}
.dbadge-n{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:800;line-height:1}
.dbadge-l{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-top:1px}
.dbadge.red{background:var(--red-bg)}.dbadge.red .dbadge-n{color:var(--red)}.dbadge.red .dbadge-l{color:var(--red)}
.dbadge.orange{background:var(--orange-bg)}.dbadge.orange .dbadge-n{color:var(--orange)}.dbadge.orange .dbadge-l{color:var(--orange)}
.dbadge.purple{background:var(--purple-bg)}.dbadge.purple .dbadge-n{color:var(--purple)}.dbadge.purple .dbadge-l{color:var(--purple)}
.dcob-toggle{color:var(--mut);font-size:18px;transition:.2s}
.dcob-toggle.open{transform:rotate(180deg)}
.dcob-units{border-top:1px solid var(--line);display:none}
.dcob-units.open{display:block}
.chip{display:inline-flex;align-items:center;padding:5px 12px;border-radius:20px;font-size:11.5px;font-weight:700;white-space:nowrap}
.chip.red{background:var(--red-bg);color:var(--red)}.chip.orange{background:var(--orange-bg);color:var(--orange)}
.chip.purple{background:var(--purple-bg);color:var(--purple)}.chip.green{background:var(--green-bg);color:var(--green)}
.chip.gray{background:var(--gray-bg);color:var(--mut)}
/* ── COBRANZA UNIT ROW NEW ── */
.unit-row{display:flex;align-items:center;gap:0;padding:0;border-bottom:1px solid var(--line)}
.unit-row:last-child{border-bottom:none}
.unit-row.critico{background:#FFFAF9}.unit-row.urgente{background:#FFFDF8}.unit-row.anticipo{background:#FDFAFF}
.u-dias-block{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px 16px;min-width:80px;border-right:1px solid var(--line)}
.u-dias-n{font-family:'Barlow Condensed',sans-serif;font-size:38px;font-weight:800;line-height:1}
.u-dias-n.red{color:var(--red)}.u-dias-n.orange{color:var(--orange)}.u-dias-n.purple{color:var(--purple)}
.u-dias-l{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);margin-top:1px;text-align:center}
.u-body{flex:1;padding:12px 16px;display:flex;flex-direction:column;gap:4px}
.u-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.u-fam{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:800}
.u-fam.critico{color:var(--red)}.u-fam.urgente{color:var(--orange)}.u-fam.anticipo{color:var(--purple)}
.u-estado-pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700}
.u-estado-pill.critico{background:var(--red-bg);color:var(--red)}
.u-estado-pill.urgente{background:var(--orange-bg);color:var(--orange)}
.u-estado-pill.anticipo{background:var(--purple-bg);color:var(--purple)}
.u-timeline{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px}
.u-titem{display:flex;flex-direction:column;gap:1px}
.u-titem-lbl{font-size:9.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);font-weight:600}
.u-titem-val{font-weight:700;color:var(--ink)}
.u-titem-val.highlight{color:var(--navy)}
.u-folio-line{font-size:11px;color:var(--mut)}
.u-folio-line span{font-family:monospace}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px;margin-bottom:24px}
.scard{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:16px 18px}
.scard.red{border-left:5px solid var(--red)}.scard.orange{border-left:5px solid var(--orange)}.scard.green{border-left:5px solid var(--green)}
.sl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;color:var(--mut)}
.sn{font-family:'Barlow Condensed',sans-serif;font-size:44px;font-weight:800;line-height:1}
.scard.red .sn{color:var(--red)}.scard.orange .sn{color:var(--orange)}.scard.green .sn{color:var(--green)}
.ss{font-size:11.5px;color:var(--mut);margin-top:2px}
.prog-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;margin-bottom:28px}
.pcard{background:#fff;border:1.5px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;transition:.15s}
.pcard:hover{border-color:#9BBDE0;box-shadow:0 4px 16px rgba(4,44,83,.08)}
.pcard-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.pcard-name{font-weight:700;font-size:13px;color:var(--navy)}
.pcard-alert{font-size:12px;font-weight:700}
.pcard-body{padding:12px 16px;display:flex;flex-direction:column;gap:7px}
.mrow{display:flex;align-items:center;gap:10px}
.mname{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;min-width:30px;color:var(--navy)}
.mbar{flex:1;height:10px;background:#EDF1F7;border-radius:6px;overflow:hidden}
.mbar-fill{height:100%;border-radius:6px}
.mbar-fill.green{background:var(--green)}.mbar-fill.blue{background:var(--blue)}.mbar-fill.orange{background:var(--orange)}.mbar-fill.red{background:var(--red)}.mbar-fill.gray{background:#ccc}
.mgap{font-size:12px;font-weight:700;min-width:66px;text-align:right;white-space:nowrap}
.mgap.red{color:var(--red)}.mgap.orange{color:var(--orange)}.mgap.green{color:var(--green)}.mgap.gray{color:var(--mut)}
.mleg{font-size:10px;color:var(--mut);padding-left:40px;margin-top:-4px}
.action-card{background:#fff;border:1.5px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:14px}
.action-head{padding:16px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.action-head h2{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;text-transform:uppercase;color:var(--navy)}
.arow{display:grid;grid-template-columns:170px 56px 1fr 130px;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid var(--line)}
.arow:last-child{border-bottom:none}
.ar-d{font-size:13px;font-weight:700;color:var(--navy)}
.ar-m{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:800;color:var(--navy)}
.big-bar{height:10px;background:#EDF1F7;border-radius:6px;overflow:hidden;margin-bottom:4px}
.big-fill{height:100%;border-radius:6px}
.ar-nums{font-size:11px;color:var(--mut)}
.ar-act{text-align:right}
.back-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border:1.5px solid var(--line);border-radius:8px;background:#fff;font-size:12px;font-weight:600;color:var(--mut);cursor:pointer;margin-bottom:18px}
.back-btn:hover{border-color:var(--blue);color:var(--blue)}
.mod-detail{padding:18px 20px;border-bottom:1px solid var(--line)}
.mod-detail:last-child{border-bottom:none}
.mod-hdr{display:flex;align-items:center;gap:14px;margin-bottom:10px;flex-wrap:wrap}
.mod-nm{font-family:'Barlow Condensed',sans-serif;font-size:32px;font-weight:800;color:var(--navy)}
.mod-stats{display:flex;gap:14px;flex-wrap:wrap}
.si{display:flex;flex-direction:column;align-items:center}
.si-n{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:700}
.si-l{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}
.fo-item{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #EFF3F8;font-size:12.5px;flex-wrap:wrap}
.fo-item:last-child{border-bottom:none}
.fo-num{font-weight:700;color:var(--navy)}
.tag-pv{background:#FEF0E6;color:var(--orange);font-size:10px;font-weight:700;padding:2px 8px;border-radius:8px}
.tag-ok{background:var(--green-bg);color:var(--green);font-size:10px;font-weight:700;padding:2px 8px;border-radius:8px}
.no-bo{background:var(--red-bg);border-radius:8px;padding:10px 14px;font-size:12.5px;color:var(--red);font-weight:600}
.loading-overlay{display:none;position:fixed;inset:0;background:rgba(4,44,83,.4);z-index:100;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:#fff;font-weight:700;font-size:16px}
.loading-overlay.on{display:flex}
.loader{width:40px;height:40px;border:4px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
.toast{position:fixed;bottom:24px;right:24px;background:#1A7A4A;color:#fff;padding:12px 20px;border-radius:10px;font-size:13px;font-weight:600;z-index:200;display:none;align-items:center;gap:8px;box-shadow:0 4px 20px rgba(0,0,0,.2)}
.toast.on{display:flex}
.toast.err{background:var(--red)}
footer{text-align:center;padding:20px;font-size:11px;color:var(--mut)}
@media(max-width:700px){
  .alert-strip{grid-template-columns:1fr}
  .unit-row{grid-template-columns:44px 1fr;grid-template-rows:auto auto}
  .u-dias,.unit-row>span{grid-column:1/3}
  .arow{grid-template-columns:1fr 1fr}
  header{flex-wrap:wrap;padding:12px 16px}
}
</style>
</head>
<body>

<div class="loading-overlay" id="overlay">
  <div class="loader"></div>
  <div>Actualizando datos desde LDR…</div>
</div>
<div class="toast" id="toast"></div>

<header>
  <div class="h-brand">
    <h1>Foton · Panel Operativo 2026</h1>
    <p>LÍNEA S3 · S5 · S6 · S8 · S12 — REGIÓN CENTRO-SUR</p>
  </div>
  <div class="h-right">
    <div class="h-corte"><div class="dot"></div><span id="corte-lbl">Cargando…</span></div>
    <button class="btn-update" id="btn-update" onclick="actualizarDatos()">
      <span class="ico">🔄</span>
      <span class="spin">⟳</span>
      Actualizar
    </button>
  </div>
</header>

<div class="tabs">
  <div class="tab on" data-t="cob" id="tab-cob">💳 Cobranza</div>
  <div class="tab" data-t="prog" id="tab-prog">📦 Back Order & Programación</div>
</div>

<div class="wrap">
  <div class="pane on" id="pane-cob">
    <div id="cob-strips" class="alert-strip"></div>
    <div id="cob-main"></div>
  </div>
  <div class="pane" id="pane-prog">
    <div id="prog-summary" class="summary"></div>
    <div id="prog-main"></div>
  </div>
</div>

<footer>Fuente: LDR Solutions · Solo modelos S3-S12 · Región Centro-Sur · Los datos se actualizan automáticamente cada día a las 8am</footer>

<script>
const SB = 'https://gblwoaaitnqbgorxaydv.supabase.co/rest/v1';
const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdibHdvYWFpdG5xYmdvcnhheWR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxOTQ3NTMsImV4cCI6MjA5NTc3MDc1M30.o7zYCCfH2rHEs69o4U7Zc9dM4IvQi8GsXRlZFW_2kso';
const H = { apikey: KEY, Authorization: 'Bearer ' + KEY };

const DL = {astur:"Autos EMCG",tang:"Asia Central",bavi:"Burk Automotriz",ruano:"Metropolitanos GR",orient:"Camiones Orientales",prem:"Premium del Centro",gcm:"GC Milenio",jimenez:"Jiménez Autocamiones",pen:"Vehículos Península",xian:"Xian Motors"};
const MODS = ["S3","S5","S6","S8","S12"];
let COB=[], PROG=[], progDealer="all";

async function q(path) {
  const r = await fetch(SB + path, {headers: H});
  if (!r.ok) throw new Error(r.status + ' ' + path);
  return r.json();
}

function toast(msg, err=false) {
  const t = document.getElementById('toast');
  t.textContent = (err ? '❌ ' : '✅ ') + msg;
  t.className = 'toast on' + (err?' err':'');
  setTimeout(() => t.classList.remove('on'), 4000);
}

async function cargarDatos() {
  const [cob, prog, bp, fac] = await Promise.all([
    q('/cobranza_2026?anio=eq.2026&select=*&order=dias_alerta.desc'),
    q('/back_order?select=*'),
    q('/bp_anual?anio=eq.2026&select=distribuidor_id,modelo,unidades_bp'),
    q('/facturado_ytd?anio=eq.2026&select=distribuidor_id,modelo,unidades_facturadas')
  ]);
  COB = cob;

  // Build prog matrix
  const bpMap={}, facMap={}, boMap={};
  bp.forEach(r=>{ const k=r.distribuidor_id+'|'+r.modelo; bpMap[k]=(bpMap[k]||0)+r.unidades_bp; });
  fac.forEach(r=>{ const fm=r.modelo.replace(/ (MT|AMT)$/,''); const k=r.distribuidor_id+'|'+fm; facMap[k]=(facMap[k]||0)+r.unidades_facturadas; });
  prog.forEach(r=>{
    const fm = (['S3','S5','S6','S8','S12'].find(m=>r.modelo.startsWith(m+' '))||r.modelo.split(' ')[0]);
    const k=r.distribuidor_id+'|'+fm;
    if(!boMap[k]) boMap[k]={conf:0,pv:0,folios:[]};
    if(r.status==='confirmado') boMap[k].conf+=r.unidades; else boMap[k].pv+=r.unidades;
    boMap[k].folios.push({folio:r.notas?.split('|')[0]?.replace('Folio ','').trim()||'',u:r.unidades,status:r.status,fecha:r.created_at?.slice(0,10)||'',modelo:r.modelo,obs:r.notas?.includes('OBS:')?r.notas.split('OBS:')[1]?.split('|')[0]?.trim():''});
  });

  PROG = [];
  Object.keys(DL).forEach(did=>{
    MODS.forEach(m=>{
      const bk=did+'|'+m, fk=did+'|'+m;
      const bp_v=bpMap[bk]||0, fac_v=facMap[fk]||0;
      const bo=boMap[bk]||{conf:0,pv:0,folios:[]};
      const gap=Math.max(0,bp_v-fac_v-bo.conf-bo.pv);
      let sem='sinbp';
      if(bp_v>0){
        if(fac_v>=bp_v) sem='cumplido';
        else if(gap===0) sem='cubierto';
        else if(bo.conf+bo.pv>0) sem='parcial';
        else sem='urgente';
      }
      PROG.push({did,modelo:m,bp:bp_v,fac:fac_v,conf:bo.conf,pv:bo.pv,gap,sem,folios:bo.folios});
    });
  });

  // Update corte date
  const maxDate = cob.reduce((mx,r)=>{ const d=r.f_factura||''; return d>mx?d:mx; },'');
  document.getElementById('corte-lbl').textContent = 'Corte ' + (maxDate||'—');

  renderCob();
  renderProgSummary();
  renderProgMain();
  updateBadges();
}

async function actualizarDatos() {
  const btn = document.getElementById('btn-update');
  document.getElementById('overlay').classList.add('on');
  btn.classList.add('loading');
  try {
    await cargarDatos();
    toast('Datos actualizados correctamente');
  } catch(e) {
    toast('Error al actualizar: ' + e.message, true);
  } finally {
    document.getElementById('overlay').classList.remove('on');
    btn.classList.remove('loading');
  }
}

// TABS
document.querySelectorAll('.tab').forEach(t=>{
  t.onclick=()=>{
    document.querySelectorAll('.tab,.pane').forEach(x=>x.classList.remove('on'));
    t.classList.add('on');
    document.getElementById('pane-'+t.dataset.t).classList.add('on');
  };
});

function updateBadges(){
  const alerts=COB.filter(r=>['critico','urgente','anticipo'].includes(r.estado)).length;
  const urgP=PROG.filter(r=>r.sem==='urgente').length;
  document.getElementById('tab-cob').innerHTML='💳 Cobranza <span class="tbadge">'+alerts+'</span>';
  document.getElementById('tab-prog').innerHTML='📦 Back Order & Programación <span class="tbadge">'+urgP+' sin BO</span>';
}

function diasColor(n){ if(n>=30) return 'red'; if(n>=15) return 'orange'; return 'purple'; }
function fam(m){ return (['S12','S8','S6','S5','S3'].find(k=>m.includes(k)))||m.split(' ')[0]; }

function renderCob(){
  const criticos=COB.filter(r=>r.estado==='critico');
  const urgentes=COB.filter(r=>r.estado==='urgente');
  const anticipos=COB.filter(r=>r.estado==='anticipo');
  const alertas=[...criticos,...urgentes,...anticipos];

  document.getElementById('cob-strips').innerHTML=
    `<div class="astrip red">
      <div class="astrip-num">${criticos.length}</div>
      <div class="astrip-lbl">🔴 ENTREGADO SIN PAGO</div>
      <div class="astrip-sub">Distribuidor ya recibió la unidad</div>
    </div>
    <div class="astrip orange">
      <div class="astrip-num">${urgentes.length}</div>
      <div class="astrip-lbl">🟠 LIBERADO SIN PAGO</div>
      <div class="astrip-sub">Planta liberó, pendiente de cobrar</div>
    </div>
    <div class="astrip purple">
      <div class="astrip-num">${anticipos.length}</div>
      <div class="astrip-lbl">🟣 ANTICIPO PENDIENTE</div>
      <div class="astrip-sub">Pago parcial, falta el saldo</div>
    </div>`;

  const byDealer={};
  alertas.forEach(r=>{
    if(!byDealer[r.distribuidor_id]) byDealer[r.distribuidor_id]={critico:[],urgente:[],anticipo:[]};
    byDealer[r.distribuidor_id][r.estado].push(r);
  });

  const order=Object.entries(byDealer).sort(([,a],[,b])=>
    b.critico.length-a.critico.length||b.urgente.length-a.urgente.length||b.anticipo.length-a.anticipo.length
  );

  let html='';
  if(!alertas.length){
    html='<div style="text-align:center;padding:60px;color:var(--green);font-size:16px;font-weight:700">✅ Sin alertas de cobranza</div>';
  } else {
    html=`<div class="section-lbl">Cobros pendientes por distribuidor <span class="cnt">${order.length} distribuidores · ${alertas.length} unidades</span></div>`;
    order.forEach(([did,g])=>{
      // Sort: critico first, then by dias desc
      const all=[...g.critico,...g.urgente,...g.anticipo].sort((a,b)=>{
        const ep={'critico':0,'urgente':1,'anticipo':2};
        if(ep[a.estado]!==ep[b.estado]) return ep[a.estado]-ep[b.estado];
        return b.dias_alerta-a.dias_alerta;
      });
      const tc=g.critico.length?'has-critico':g.urgente.length?'has-urgente':'has-anticipo';
      const maxDias=Math.max(...all.map(r=>r.dias_alerta));
      const dcHead=maxDias>=30?'red':maxDias>=15?'orange':'purple';

      html+=`<div class="dcob-card ${tc}">
        <div class="dcob-head" onclick="toggleDcob(this)">
          <div class="dcob-name">${DL[did]||did}</div>
          <div class="dcob-badges">
            ${g.critico.length?`<div class="dbadge red"><div class="dbadge-n">${g.critico.length}</div><div class="dbadge-l">Entregado</div></div>`:''}
            ${g.urgente.length?`<div class="dbadge orange"><div class="dbadge-n">${g.urgente.length}</div><div class="dbadge-l">Liberado</div></div>`:''}
            ${g.anticipo.length?`<div class="dbadge purple"><div class="dbadge-n">${g.anticipo.length}</div><div class="dbadge-l">Anticipo</div></div>`:''}
            <div class="dbadge" style="background:#F4F7FB">
              <div class="dbadge-n" style="color:var(--${dcHead});font-size:20px">${maxDias}d</div>
              <div class="dbadge-l">max sin pago</div>
            </div>
          </div>
          <div class="dcob-toggle">▾</div>
        </div>
        <div class="dcob-units">
          ${all.map(r=>{
            const cls={critico:'red',urgente:'orange',anticipo:'purple'}[r.estado];
            const dc=r.dias_alerta>=30?'red':r.dias_alerta>=15?'orange':'purple';
            // Key date: entrega if critico, liberacion if urgente, factura if anticipo
            const esEntregada = r.f_entrega && r.f_entrega!=='';
            const esLiberada  = r.f_liberacion && r.f_liberacion!=='';
            const estadoLbl = r.estado==='critico'
              ? '🔴 Entregado sin pago'
              : r.estado==='urgente'
              ? (esEntregada ? '🟠 Entregado sin pago' : '🟠 Liberado — en camino')
              : '🟣 Anticipo pendiente';
            const fechaRef = r.estado==='critico'
              ? (r.f_entrega||r.f_liberacion||r.f_factura)
              : r.estado==='urgente'
              ? (r.f_liberacion||r.f_factura)
              : r.f_factura;
            const diasLabel = r.estado==='critico'
              ? (r.f_entrega ? 'días desde entrega' : 'días desde liberación')
              : r.estado==='urgente'
              ? (esLiberada ? 'días desde liberación' : 'días desde factura')
              : 'días desde factura';
            return`<div class="unit-row ${r.estado}">
              <div class="u-dias-block">
                <div class="u-dias-n ${dc}">${r.dias_alerta}</div>
                <div class="u-dias-l">${diasLabel}</div>
              </div>
              <div class="u-body">
                <div class="u-top">
                  <div class="u-fam ${cls}">${fam(r.modelo)}</div>
                  <div class="u-estado-pill ${cls}">${estadoLbl}</div>
                </div>
                <div class="u-timeline">
                  <div class="u-titem">
                    <div class="u-titem-lbl">Facturado</div>
                    <div class="u-titem-val">${r.f_factura||'—'}</div>
                  </div>
                  ${esLiberada?`<div class="u-titem">
                    <div class="u-titem-lbl">Liberado planta</div>
                    <div class="u-titem-val highlight">${r.f_liberacion}</div>
                  </div>`:''}
                  ${esEntregada?`<div class="u-titem">
                    <div class="u-titem-lbl">Entregado</div>
                    <div class="u-titem-val highlight" style="color:var(--${cls})">${r.f_entrega}</div>
                  </div>`:''}
                </div>
                <div class="u-folio-line">Folio <span>${r.folio}</span> · <span>${r.vin}</span></div>
              </div>
            </div>`;
          }).join('')}
        </div>
      </div>`;
    });
  }
  document.getElementById('cob-main').innerHTML=html;
  setTimeout(()=>{ const c=document.querySelectorAll('.dcob-head'); if(c.length===1) toggleDcob(c[0]); },100);
}

function toggleDcob(head){
  head.nextElementSibling.classList.toggle('open');
  head.querySelector('.dcob-toggle').classList.toggle('open');
}

function mbc(sem){ return{cumplido:'green',cubierto:'blue',parcial:'orange',urgente:'red',sinbp:'gray'}[sem]||'gray'; }

function renderProgSummary(){
  const urg=PROG.filter(r=>r.sem==='urgente').length;
  const par=PROG.filter(r=>r.sem==='parcial').length;
  const gap=PROG.reduce((s,r)=>s+r.gap,0);
  const bc=PROG.reduce((s,r)=>s+r.conf,0);
  const bpv=PROG.reduce((s,r)=>s+r.pv,0);
  document.getElementById('prog-summary').innerHTML=
    `<div class="scard red"><div class="sl">🔴 Ordenar ya</div><div class="sn">${urg}</div><div class="ss">Modelos sin ningún BO</div></div>`+
    `<div class="scard orange"><div class="sl">🟠 Ampliar pedido</div><div class="sn">${par}</div><div class="ss">BO insuficiente vs BP</div></div>`+
    `<div class="scard"><div class="sl">Total por ordenar</div><div class="sn" style="color:var(--navy)">${gap}</div><div class="ss">Unidades · gap región</div></div>`+
    `<div class="scard green"><div class="sl">BO confirmado</div><div class="sn">${bc}</div><div class="ss">Pedidos 2026</div></div>`+
    `<div class="scard orange"><div class="sl">BO por validar</div><div class="sn">${bpv}</div><div class="ss">Pedidos 2025 → confirmar</div></div>`;
}

function renderProgMain(){
  if(progDealer!=='all'){ renderProgDealer(progDealer); return; }
  const cards=Object.entries(DL).map(([id,nm])=>{
    const rows=PROG.filter(r=>r.did===id);if(!rows.length)return'';
    const urg=rows.filter(r=>r.sem==='urgente').length;
    const par=rows.filter(r=>r.sem==='parcial').length;
    const ac=urg?'red':par?'orange':'green';
    const at=urg?urg+' sin BO':par?par+' con gap':'Todo en orden';
    return`<div class="pcard" onclick="goProgDealer('${id}')">
      <div class="pcard-head"><div class="pcard-name">${nm}</div><div class="pcard-alert" style="color:var(--${ac})">${at}</div></div>
      <div class="pcard-body">
        ${MODS.map(m=>{
          const r=rows.find(x=>x.modelo===m);
          if(!r||r.bp===0)return`<div class="mrow"><div class="mname" style="color:#ccc">${m}</div><div style="flex:1;text-align:center;font-size:11px;color:#ccc">Sin BP</div></div>`;
          const pct=Math.min(100,Math.round((r.fac+r.conf+r.pv)/r.bp*100));
          const gc={cumplido:'green',cubierto:'green',parcial:'orange',urgente:'red',sinbp:'gray'}[r.sem]||'gray';
          return`<div class="mrow"><div class="mname">${m}</div><div class="mbar"><div class="mbar-fill ${mbc(r.sem)}" style="width:${pct}%"></div></div><div class="mgap ${gc}">${r.gap>0?'-'+r.gap+' u':'✓ '+r.fac+'/'+r.bp}</div></div><div class="mleg">Fac ${r.fac} · BO ${r.conf+r.pv} · BP ${r.bp}</div>`;
        }).join('')}
      </div>
    </div>`;
  }).join('');

  const urg=PROG.filter(r=>r.sem==='urgente'&&r.gap>0).sort((a,b)=>b.gap-a.gap);
  const par=PROG.filter(r=>r.sem==='parcial'&&r.gap>0).sort((a,b)=>b.gap-a.gap);
  let ahtml='';
  if(urg.length) ahtml+=`<div class="action-card"><div class="action-head"><h2>🔴 Ordenar de inmediato</h2><span style="font-size:12px;color:var(--mut)">${urg.length} modelos sin back order</span></div>${urg.map(r=>{const pct=Math.min(100,Math.round(r.fac/r.bp*100));return`<div class="arow"><div class="ar-d">${DL[r.did]||r.did}</div><div class="ar-m">${r.modelo}</div><div><div class="big-bar"><div class="big-fill" style="width:${pct}%;background:var(--blue)"></div></div><div class="ar-nums">Facturado ${r.fac} de ${r.bp} · <strong style="color:var(--red)">${r.gap} sin pedir</strong></div></div><div class="ar-act"><span class="chip red">Programar pedido</span></div></div>`;}).join('')}</div>`;
  if(par.length) ahtml+=`<div class="action-card"><div class="action-head"><h2>🟠 Ampliar pedido</h2><span style="font-size:12px;color:var(--mut)">${par.length} modelos con gap</span></div>${par.map(r=>{const pct=Math.min(100,Math.round((r.fac+r.conf+r.pv)/r.bp*100));return`<div class="arow"><div class="ar-d">${DL[r.did]||r.did}</div><div class="ar-m">${r.modelo}</div><div><div class="big-bar"><div class="big-fill" style="width:${pct}%;background:var(--orange)"></div></div><div class="ar-nums">Fac ${r.fac} · BO ${r.conf+r.pv} · BP ${r.bp} · <strong style="color:var(--orange)">faltan ${r.gap}</strong></div></div><div class="ar-act"><span class="chip orange">Ampliar BO</span></div></div>`;}).join('')}</div>`;

  document.getElementById('prog-main').innerHTML=`<div class="prog-grid">${cards}</div>${ahtml}`;
}

function renderProgDealer(did){
  const rows=PROG.filter(r=>r.did===did);
  const SL={cumplido:'✅ BP cumplido',cubierto:'🔵 Cubierto con BO',parcial:'🟠 Ampliar pedido',urgente:'🔴 Ordenar ya',sinbp:'Sin BP'};
  const SC={cumplido:'green',cubierto:'green',parcial:'orange',urgente:'red',sinbp:'gray'};
  let html=`<button class="back-btn" onclick="goProgDealer('all')">← Todos los distribuidores</button>
    <div class="action-card"><div class="action-head"><h2>${DL[did]} — Detalle por modelo</h2></div>`;
  MODS.forEach(m=>{
    const r=rows.find(x=>x.modelo===m);if(!r||r.bp===0)return;
    const pct=Math.min(100,Math.round((r.fac+r.conf+r.pv)/r.bp*100));
    html+=`<div class="mod-detail">
      <div class="mod-hdr">
        <div class="mod-nm">${m}</div>
        <div class="mod-stats">
          <div class="si"><div class="si-n" style="color:var(--navy)">${r.bp}</div><div class="si-l">BP</div></div>
          <div class="si"><div class="si-n" style="color:var(--blue)">${r.fac}</div><div class="si-l">Facturado</div></div>
          <div class="si"><div class="si-n" style="color:var(--green)">${r.conf}</div><div class="si-l">BO conf</div></div>
          <div class="si"><div class="si-n" style="color:var(--orange)">${r.pv}</div><div class="si-l">BO pv</div></div>
          <div class="si"><div class="si-n" style="color:var(--${r.gap>0?'red':'green'})">${r.gap}</div><div class="si-l">Gap</div></div>
        </div>
        <span class="chip ${SC[r.sem]}">${SL[r.sem]}</span>
      </div>
      <div class="big-bar"><div class="big-fill" style="width:${pct}%;background:var(--${mbc(r.sem)})"></div></div>
      <div style="margin-top:12px">
        ${r.folios.length
          ?r.folios.map(f=>`<div class="fo-item"><span class="fo-num">${f.folio}</span><span>${f.modelo}</span><strong>${f.u} u</strong><span style="color:var(--mut)">${f.fecha}</span>${f.status==='por_validar'?'<span class="tag-pv">Pedido 2025</span>':'<span class="tag-ok">Confirmado</span>'}${f.obs?`<span style="color:var(--mut)">${f.obs}</span>`:''}</div>`).join('')
          :`<div class="no-bo">⚠ Sin back order — programar pedido con este distribuidor</div>`}
      </div>
    </div>`;
  });
  html+='</div>';
  document.getElementById('prog-main').innerHTML=html;
}

function goProgDealer(id){
  progDealer=id;
  renderProgSummary();
  renderProgMain();
  window.scrollTo({top:0});
}

// Init
cargarDatos().catch(e=>toast('Error cargando datos: '+e.message, true));
</script>
</body>
</html>
