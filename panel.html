<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Foton · Panel Operativo 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F7FB; --card:#FFFFFF; --ice:#EEF5FD;
  --deep:#002870; --navy:#042C53; --blue:#185FA5; --sky:#4A90D9; --tab:#0B4FA8;
  --ink:#1B2733; --mut:#5B6B7C; --dim:#8496A8;
  --line:#D6E4F2; --line2:#E8EFF7;
  --red:#C0392B;  --red-bg:#FBEAE7;
  --org:#D35400;  --org-bg:#FDEDE3;
  --amb:#C47A1A;  --amb-bg:#FDF3E3;
  --blu:#185FA5;  --blu-bg:#EEF5FD;
  --grn:#1E8E5A;  --grn-bg:#E2F4EA;
  --pur:#8E44AD;  --pur-bg:#F5EEF8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{font-family:Inter,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.mono{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}

/* ── CHROME ── */
header{background:linear-gradient(180deg,#00214F,var(--deep));padding:13px 24px;
  display:flex;align-items:center;gap:18px}
.logo{height:24px;width:auto;flex-shrink:0}
.hdiv{width:1px;height:24px;background:rgba(255,255,255,.22)}
.htitle .t1{font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:700;
  letter-spacing:.4px;line-height:1;color:#fff}
.htitle .t2{font-size:9.5px;color:rgba(255,255,255,.55);letter-spacing:1.5px;font-weight:600;margin-top:3px}
.hspace{flex:1}
.rswitch{display:flex;gap:2px;background:rgba(255,255,255,.1);border-radius:8px;padding:3px}
.rbtn{padding:7px 15px;border:0;background:none;color:rgba(255,255,255,.65);font-family:Inter;
  font-size:12px;font-weight:600;border-radius:6px;cursor:pointer;transition:.14s;white-space:nowrap}
.rbtn:hover{color:#fff}
.rbtn.on{background:#fff;color:var(--deep)}
.corte{font-size:10px;color:rgba(255,255,255,.5);text-align:right;line-height:1.35;font-weight:500}
.corte b{color:rgba(255,255,255,.85);display:block;font-size:11.5px;font-weight:600}
.refresh{width:32px;height:32px;border-radius:7px;border:1px solid rgba(255,255,255,.25);
  background:rgba(255,255,255,.08);color:rgba(255,255,255,.8);cursor:pointer;font-size:14px;transition:.14s}
.refresh:hover{background:#fff;color:var(--deep)}
.refresh.load{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.tabbar{display:flex;background:var(--tab);padding:0 24px}
.tab{padding:12px 22px;border:0;background:none;color:rgba(255,255,255,.6);font-family:Inter;
  font-size:13px;font-weight:600;cursor:pointer;border-bottom:3px solid transparent;
  transition:.14s;display:flex;align-items:center;gap:8px}
.tab:hover{color:rgba(255,255,255,.9)}
.tab.on{color:#fff;border-bottom-color:#fff}
.tbadge{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;padding:2px 6px;
  border-radius:5px;background:rgba(255,255,255,.18);color:#fff}

/* ── FRANJA DEGRADADO ── */
.strip{background:linear-gradient(100deg,#0B57B5 0%,#2E7FD4 60%,#4A90D9 100%);
  padding:17px 24px;display:flex;align-items:center;gap:26px}
.strip-main{font-family:'Barlow Condensed',sans-serif;font-size:25px;font-weight:700;
  color:#fff;line-height:1.15;letter-spacing:.2px}
.strip-main em{font-style:normal;color:#FFE08A}
.strip-sub{font-size:12px;color:rgba(255,255,255,.8);margin-top:4px;line-height:1.45}
.strip-sub b{color:#fff;font-weight:600}
.strip-txt{flex:1}
.strip-kpis{display:flex;gap:0;flex-shrink:0}
.sk{padding:0 20px;border-left:1px solid rgba(255,255,255,.22);text-align:center}
.sk:first-child{border-left:0}
.sk-n{font-family:'Barlow Condensed',sans-serif;font-size:27px;font-weight:800;color:#fff;line-height:1}
.sk-l{font-size:9px;color:rgba(255,255,255,.7);font-weight:600;letter-spacing:.7px;
  text-transform:uppercase;margin-top:3px}

main{padding:20px 24px 60px;max-width:1500px;margin:0 auto}

/* ── SECCION ── */
.sec{margin-bottom:16px}
.sec-h{display:flex;align-items:center;gap:12px;margin-bottom:9px}
.sec-h h3{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;
  text-transform:uppercase;letter-spacing:1.2px;color:var(--mut);white-space:nowrap}
.sec-h .rule{flex:1;height:1px;background:var(--line)}
.sec-h span{font-size:11px;color:var(--dim);white-space:nowrap}

.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;
  box-shadow:0 1px 3px rgba(4,44,83,.05)}

/* ── TARJETAS MODELO ── */
.msum{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:18px}
.mcard{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:14px 16px;
  box-shadow:0 1px 3px rgba(4,44,83,.05)}
.mcard-top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:9px}
.mcard-mod{font-family:'Barlow Condensed',sans-serif;font-size:25px;font-weight:800;
  color:var(--navy);letter-spacing:.5px}
.mcard-pct{font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:700}
.mcard-bar{height:5px;background:var(--line2);border-radius:3px;overflow:hidden;margin-bottom:9px}
.mcard-fill{height:100%;border-radius:3px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.mcard-nums{display:flex;justify-content:space-between;font-size:9.5px;color:var(--dim);font-weight:500}
.mcard-nums b{font-family:'JetBrains Mono',monospace;color:var(--ink);font-weight:600;
  display:block;font-size:12px;margin-top:1px}

/* ── LISTA ACCION ── */
.act{display:grid;grid-template-columns:26px 1fr 52px 132px 74px;align-items:center;gap:12px;
  padding:11px 18px;border-bottom:1px solid var(--line2);cursor:pointer;transition:background .12s}
.act:last-child{border-bottom:0}
.act:hover{background:var(--ice)}
.act-i{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--dim);font-weight:600}
.act-d{font-size:13px;font-weight:600;color:var(--navy)}
.act-r{font-size:10px;color:var(--dim);margin-top:2px;font-weight:500}
.act-m{font-family:'Barlow Condensed',sans-serif;font-size:21px;font-weight:800;text-align:center}
.act-bar{height:5px;background:var(--line2);border-radius:3px;overflow:hidden;margin-bottom:4px}
.act-fill{height:100%;border-radius:3px}
.act-lbl{font-size:9.5px;color:var(--dim);font-weight:500}
.act-lbl b{font-family:'JetBrains Mono',monospace;color:var(--mut)}
.act-g{text-align:right}
.act-gn{font-family:'JetBrains Mono',monospace;font-size:17px;font-weight:700}
.act-gl{font-size:8.5px;color:var(--dim);font-weight:600;letter-spacing:.3px}

/* ── MATRIZ ── */
.mtx-wrap{overflow-x:auto}
.mtx{width:100%;border-collapse:separate;border-spacing:0}
.mtx th{background:var(--ice);font-size:9.5px;font-weight:700;color:var(--mut);text-transform:uppercase;
  letter-spacing:.9px;padding:9px 6px;text-align:center;border-bottom:1px solid var(--line)}
.mtx th:first-child{text-align:left;padding-left:18px;min-width:190px}
.mtx th.mh{font-family:'Barlow Condensed',sans-serif;font-size:16px;letter-spacing:.5px;
  color:var(--navy);width:90px}
.mtx td{padding:0;border-bottom:1px solid var(--line2)}
.mtx tr:last-child td{border-bottom:0}
.mtx tr:hover td{background:#FAFCFE}
.mtx-d{padding:0 18px;font-size:12.5px;font-weight:600;white-space:nowrap;color:var(--navy)}
.mtx-dr{font-size:9.5px;color:var(--dim);font-weight:500;margin-top:1px}
.cell{margin:3px;height:38px;border-radius:6px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;cursor:pointer;transition:.14s;border:1px solid transparent;position:relative}
.cell:hover{transform:scale(1.06);box-shadow:0 3px 10px rgba(4,44,83,.16);z-index:2}
.cell-p{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;line-height:1}
.cell-g{font-size:8.5px;font-weight:600;opacity:.8;margin-top:2px;letter-spacing:.2px}
.cell.na{background:#F7F9FC;cursor:default;border-color:var(--line2)}
.cell.na:hover{transform:none;box-shadow:none}
.cell.na .cell-p{color:#B9C7D6;font-size:11px}

.legend{display:flex;align-items:center;gap:14px;padding:11px 18px;border-top:1px solid var(--line2);
  font-size:10.5px;color:var(--dim);flex-wrap:wrap;background:#FBFCFE}
.lg{display:flex;align-items:center;gap:6px;font-weight:500}
.lgc{width:13px;height:13px;border-radius:4px;border:1px solid rgba(4,44,83,.08)}

/* ── AGING ── */
.aging{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.agc{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:14px 17px;
  border-left:4px solid var(--line);box-shadow:0 1px 3px rgba(4,44,83,.05)}
.agc.b1{border-left-color:var(--blu)}
.agc.b2{border-left-color:var(--amb)}
.agc.b3{border-left-color:var(--org)}
.agc.b4{border-left-color:var(--red)}
.agc-l{font-size:9.5px;color:var(--dim);font-weight:700;letter-spacing:.9px;text-transform:uppercase}
.agc-n{font-family:'Barlow Condensed',sans-serif;font-size:37px;font-weight:800;line-height:1;margin:5px 0 3px}
.agc-s{font-size:10.5px;color:var(--mut);font-weight:500}
.agc-s b{font-family:'JetBrains Mono',monospace;color:var(--ink)}

/* ── COBRANZA DEALER ── */
.cd{border-bottom:1px solid var(--line2)}
.cd:last-child{border-bottom:0}
.cd-h{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:16px;padding:12px 18px;
  cursor:pointer;transition:background .12s}
.cd-h:hover{background:var(--ice)}
.cd-n{font-size:13.5px;font-weight:600;color:var(--navy)}
.cd-r{font-size:10px;color:var(--dim);margin-top:2px;font-weight:500}
.cd-pills{display:flex;gap:6px}
.pill{display:flex;align-items:center;gap:5px;padding:4px 9px;border-radius:6px;font-size:11px;font-weight:600}
.pill .mono{font-size:12px;font-weight:700}
.pill.c{background:var(--red-bg);color:var(--red)}
.pill.u{background:var(--amb-bg);color:var(--amb)}
.pill.a{background:var(--pur-bg);color:var(--pur)}
.cd-max{text-align:right;min-width:66px}
.cd-maxn{font-family:'JetBrains Mono',monospace;font-size:19px;font-weight:700}
.cd-maxl{font-size:8.5px;color:var(--dim);font-weight:600;letter-spacing:.3px}
.cd-body{max-height:0;overflow:hidden;transition:max-height .32s ease}
.cd-body.open{max-height:2600px}
.cd-inner{padding:2px 18px 12px;background:#FBFCFE;border-top:1px solid var(--line2)}
.ur{display:grid;grid-template-columns:56px 46px 1fr auto;align-items:center;gap:13px;padding:9px 0;
  border-bottom:1px solid var(--line2)}
.ur:last-child{border-bottom:0}
.ur-d{text-align:center}
.ur-dn{font-family:'JetBrains Mono',monospace;font-size:17px;font-weight:700;line-height:1}
.ur-dl{font-size:8px;color:var(--dim);font-weight:600;letter-spacing:.2px}
.ur-m{font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:800;text-align:center;color:var(--navy)}
.ur-i{font-size:11px;color:var(--mut)}
.ur-i b{color:var(--ink);font-weight:600}
.ur-f{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--dim);margin-top:2px}
.ur-s{font-size:10px;font-weight:600;padding:3px 9px;border-radius:5px;white-space:nowrap}
.ur-s.critico{background:var(--red-bg);color:var(--red)}
.ur-s.urgente{background:var(--amb-bg);color:var(--amb)}
.ur-s.anticipo{background:var(--pur-bg);color:var(--pur)}

/* ── MODAL ── */
.modal{display:none;position:fixed;inset:0;background:rgba(4,44,83,.45);backdrop-filter:blur(4px);
  z-index:100;align-items:center;justify-content:center;padding:24px}
.modal.on{display:flex}
.mbox{background:var(--card);border-radius:14px;max-width:560px;width:100%;max-height:80vh;
  overflow:auto;box-shadow:0 20px 60px rgba(4,44,83,.3)}
.mbox-h{padding:17px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;
  justify-content:space-between;position:sticky;top:0;background:var(--card)}
.mbox-t{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;color:var(--navy)}
.mbox-s{font-size:11px;color:var(--dim);margin-top:2px}
.mx{width:28px;height:28px;border-radius:7px;border:1px solid var(--line);background:none;
  color:var(--mut);cursor:pointer;font-size:15px}
.mx:hover{border-color:var(--red);color:var(--red)}
.mbox-b{padding:18px 22px}
.mstat{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:16px}
.ms{background:var(--ice);border-radius:9px;padding:11px 13px;text-align:center}
.ms-n{font-family:'JetBrains Mono',monospace;font-size:19px;font-weight:700;color:var(--navy)}
.ms-l{font-size:8.5px;color:var(--dim);font-weight:600;letter-spacing:.4px;margin-top:2px;text-transform:uppercase}
.fr{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--line2);font-size:11.5px}
.fr:last-child{border-bottom:0}
.fr-f{font-family:'JetBrains Mono',monospace;font-weight:600;color:var(--blue);font-size:11px}
.fr-m{flex:1;color:var(--mut)}
.fr-d{font-family:'JetBrains Mono',monospace;color:var(--dim);font-size:10.5px}

.empty{padding:38px;text-align:center;color:var(--mut);font-size:12.5px}
.empty b{display:block;color:var(--grn);font-size:16px;margin-bottom:5px;font-family:'Barlow Condensed',sans-serif}

.overlay{display:none;position:fixed;inset:0;background:rgba(244,247,251,.8);z-index:200;
  align-items:center;justify-content:center}
.overlay.on{display:flex}
.spin{width:34px;height:34px;border:2.5px solid var(--line);border-top-color:var(--blue);
  border-radius:50%;animation:spin .7s linear infinite}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(90px);
  background:var(--navy);color:#fff;padding:11px 20px;border-radius:9px;font-size:12.5px;
  font-weight:500;z-index:300;transition:transform .3s cubic-bezier(.4,0,.2,1);
  box-shadow:0 8px 28px rgba(4,44,83,.28)}
.toast.on{transform:translateX(-50%) translateY(0)}

/* ── BACK ORDER PENDIENTE ── */
.bo-hd{display:grid;grid-template-columns:74px 1fr 150px 92px 1fr;gap:14px;padding:9px 18px;
  background:var(--ice);border-bottom:1px solid var(--line);font-size:9.5px;font-weight:700;
  color:var(--mut);text-transform:uppercase;letter-spacing:.9px}
.bo-row{display:grid;grid-template-columns:74px 1fr 150px 92px 1fr;gap:14px;align-items:center;
  padding:11px 18px;border-bottom:1px solid var(--line2);transition:background .12s}
.bo-row:last-child{border-bottom:0}
.bo-row:hover{background:#FAFCFE}
.bo-age{text-align:center}
.bo-age-n{font-family:'JetBrains Mono',monospace;font-size:19px;font-weight:700;line-height:1}
.bo-age-l{font-size:8px;color:var(--dim);font-weight:600;letter-spacing:.3px}
.bo-dl{font-size:12.5px;font-weight:600;color:var(--navy);line-height:1.3}
.bo-pl{font-size:10px;color:var(--dim);margin-top:2px}
.bo-mods{display:flex;flex-wrap:wrap;gap:4px}
.bo-chip{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;
  background:var(--ice);color:var(--blue);padding:2px 8px;border-radius:5px;letter-spacing:.3px}
.bo-fec{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--mut)}
.bo-fol{font-size:9.5px;color:var(--dim);margin-top:2px}
.bo-note{font-size:11px;color:var(--mut);line-height:1.35}
.bo-note b{color:var(--ink);font-weight:600}
.bo-mes{display:inline-block;background:var(--amb-bg);color:var(--amb);font-size:9.5px;
  font-weight:700;padding:2px 7px;border-radius:5px;margin-right:5px;letter-spacing:.3px}
.bo-ref{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--dim)}

/* ── FACTURAS EN MODAL ── */
.iv{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line2);font-size:11px}
.iv:last-child{border-bottom:0}
.iv-f{font-family:'JetBrains Mono',monospace;font-weight:600;color:var(--blue);min-width:62px}
.iv-v{font-family:'JetBrains Mono',monospace;color:var(--mut);flex:1;font-size:10px;letter-spacing:-.2px}
.iv-d{font-family:'JetBrains Mono',monospace;color:var(--dim);font-size:10px}
.iv-s{font-size:9.5px;font-weight:600;padding:2px 7px;border-radius:4px;white-space:nowrap;min-width:74px;text-align:center}
.iv-s.pagado{background:var(--grn-bg);color:var(--grn)}
.iv-s.critico{background:var(--red-bg);color:var(--red)}
.iv-s.urgente{background:var(--amb-bg);color:var(--amb)}
.iv-s.anticipo{background:var(--pur-bg);color:var(--pur)}
.iv-s.pendiente{background:#F0F3F7;color:var(--mut)}
.msec{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;text-transform:uppercase;
  letter-spacing:1.1px;color:var(--mut);margin:16px 0 4px;display:flex;align-items:center;gap:9px}
.msec:first-child{margin-top:0}
.msec .rule{flex:1;height:1px;background:var(--line)}
.msec span{font-family:Inter;font-size:10px;font-weight:500;letter-spacing:0;color:var(--dim);text-transform:none}

@media(max-width:1150px){
  .msum{grid-template-columns:repeat(3,1fr)}
  .aging{grid-template-columns:repeat(2,1fr)}
  .strip{flex-wrap:wrap;gap:14px}
  .strip-kpis{width:100%}
  .sk:first-child{padding-left:0}
}
@media(max-width:760px){
  header{flex-wrap:wrap;gap:12px;padding:12px 16px}
  .hspace{display:none}
  .rswitch{order:3;width:100%}
  .rbtn{flex:1}
  main{padding:16px 14px 50px}
  .msum{grid-template-columns:repeat(2,1fr)}
  .strip{padding:15px 16px}
  .strip-main{font-size:20px}
  .tabbar{padding:0 14px}
  .act{grid-template-columns:1fr 44px 66px;gap:10px}
  .act-i,.act-bar,.act-lbl{display:none}
  .bo-hd{display:none}
  .bo-row{grid-template-columns:60px 1fr;gap:10px;padding:11px 14px}
  .bo-row>:nth-child(3),.bo-row>:nth-child(4){grid-column:2}
  .bo-row>:nth-child(5){grid-column:1 / -1}
  .cd-h{grid-template-columns:1fr auto;gap:10px;padding:12px 14px}
  .cd-pills{grid-column:1 / -1;order:3;flex-wrap:wrap}
  .cd-inner{padding:2px 14px 12px}
  .ur{grid-template-columns:48px 40px 1fr;gap:10px}
  .ur-s{grid-column:1 / -1;justify-self:start}
  .mtx th:first-child{min-width:150px}
  .sec-h{flex-wrap:wrap;gap:6px}
  .sec-h .rule{display:none}
  .sec-h span{white-space:normal;flex-basis:100%}
}
</style>
</head>

let DL={}, COB=[], BOR=[], BP=[], FAC=[], MATRIX=[];

async function q(p){const r=await fetch(SB+p,{headers:H});if(!r.ok)throw new Error(r.status);return r.json()}
function toast(m,e){const t=document.getElementById('toast');t.textContent=(e?'\u2715 ':'\u2713 ')+m;
  t.classList.add('on');setTimeout(()=>t.classList.remove('on'),3200)}


const MESREX=/\b(ENERO|FEBRERO|MARZO|ABRIL|MAYO|JUNIO|JULIO|AGOSTO|SEPT?I?E?M?B?R?E?|OCTUBRE|NOVIEMBRE|DICIEMBRE|ENE|FEB|MAR|ABR|MAY|JUN|JUL|AGO|SEP|OCT|NOV|DIC)\b/i;
const MESFULL={ENE:'Enero',FEB:'Febrero',MAR:'Marzo',ABR:'Abril',MAY:'Mayo',JUN:'Junio',
  JUL:'Julio',AGO:'Agosto',SEP:'Septiembre',OCT:'Octubre',NOV:'Noviembre',DIC:'Diciembre'};
function parseF(s){if(!s)return 0;const p=String(s).split('/');
  return p.length===3?new Date(+p[2],+p[1]-1,+p[0]).getTime():0}
function diasDesde(s){const t=parseF(s);return t?Math.round((Date.now()-t)/86400000):null}
function mesEstimado(txt){
  if(!txt)return'';const m=String(txt).match(MESREX);if(!m)return'';
  const k=m[1].toUpperCase().slice(0,3);return MESFULL[k]||'';
}
function ageColor(d){if(d>180)return'#C0392B';if(d>90)return'#D35400';if(d>30)return'#C47A1A';return'#185FA5'}

function covColor(p){
  if(p>=100)return'#1E8E5A'; if(p>=75)return'#185FA5';
  if(p>=50)return'#C47A1A';  if(p>=25)return'#D35400'; return'#C0392B';
}
function covBg(p){
  if(p>=100)return'#E2F4EA'; if(p>=75)return'#EEF5FD';
  if(p>=50)return'#FDF3E3';  if(p>=25)return'#FDEDE3'; return'#FBEAE7';
}
function diasColor(d){ if(d>=60)return'#C0392B'; if(d>=31)return'#D35400'; if(d>=16)return'#C47A1A'; return'#185FA5' }

async function cargar(){
  const [dls,cob,bo,bp,fac]=await Promise.all([
    q('/distribuidores?region=in.(israel,marco)&select=id,nombre,region'),
    q('/cobranza_2026?anio=eq.2026&select=distribuidor_id,region,folio,vin,modelo,familia,f_factura,f_liberacion,f_entrega,estado,dias_alerta,dias_src&order=dias_alerta.desc'),
    q('/back_order?select=distribuidor_id,modelo,modelo_familia,unidades,fecha_solicitud,folio,plaza,obs,estatus_bo,referencia'),
    q('/bp_anual?anio=eq.2026&select=distribuidor_id,modelo,unidades_bp'),
    q('/facturado_ytd?anio=eq.2026&select=distribuidor_id,mes,modelo,unidades_facturadas')
  ]);
  DL={}; dls.forEach(d=>DL[d.id]={nombre:d.nombre,region:d.region});
  COB=cob; BOR=bo; BP=bp; FAC=fac;
  const mx=cob.reduce((a,r)=>{const p=(r.f_factura||'').split('/');if(p.length!==3)return a;
    const t=new Date(+p[2],+p[1]-1,+p[0]).getTime();return t>a.t?{t,s:r.f_factura}:a},{t:0,s:''});
  document.getElementById('corte1').textContent='Corte '+(mx.s||'\u2014');
  document.getElementById('corte2').textContent='Actualizado '+new Date().toLocaleDateString('es-MX',{day:'2-digit',month:'short'});
  render();
}

function dealersReg(){return Object.keys(DL).filter(id=>REG==='all'||DL[id].region===REG)}
function rMatch(did){return REG==='all'||(DL[did]&&DL[did].region===REG)}

function buildMatrix(){
  const ids=dealersReg(), bpM={},facM={},boM={},boF={};
  BP.forEach(r=>{const k=r.distribuidor_id+'|'+r.modelo;bpM[k]=(bpM[k]||0)+r.unidades_bp});
  FAC.forEach(r=>{const k=r.distribuidor_id+'|'+r.modelo;facM[k]=(facM[k]||0)+r.unidades_facturadas});
  BOR.forEach(r=>{const f=r.modelo_familia||MODS.find(m=>(r.modelo||'').includes(m));if(!f)return;
    const k=r.distribuidor_id+'|'+f;boM[k]=(boM[k]||0)+(r.unidades||1);
    (boF[k]=boF[k]||[]).push({modelo:r.modelo,fecha:r.fecha_solicitud||'',folio:r.folio||'',plaza:r.plaza||'',obs:r.obs||'',ref:r.referencia||''})});
  MATRIX=[];
  ids.forEach(did=>MODS.forEach(m=>{
    const k=did+'|'+m, bp=bpM[k]||0, fac=facM[k]||0, bo=boM[k]||0;
    MATRIX.push({did,modelo:m,bp,fac,bo,cov:bp>0?((fac+bo)/bp*100):null,
      gap:Math.max(0,bp-fac-bo),folios:boF[k]||[]});
  }));
}

function render(){buildMatrix();renderCob();renderBO();renderStrip();
  const al=COB.filter(r=>rMatch(r.distribuidor_id)&&['critico','urgente','anticipo'].includes(r.estado)).length;
  const sinbo=MATRIX.filter(r=>r.bp>0&&r.bo===0&&r.gap>0).length;
  document.getElementById('bcob').textContent=al;
  document.getElementById('bbo').textContent=sinbo;
}

/* ══ FRANJA ══ */
function renderStrip(){
  const s=document.getElementById('strip');
  if(TAB==='cob'){
    const al=COB.filter(r=>rMatch(r.distribuidor_id)&&['critico','urgente','anticipo'].includes(r.estado));
    if(!al.length){s.innerHTML='<div class="strip-txt"><div class="strip-main">'+RNOM[REG]+
      ' sin adeudos pendientes</div><div class="strip-sub">Toda la cartera est\u00e1 al corriente.</div></div>';return}
    const prom=Math.round(al.reduce((a,r)=>a+r.dias_alerta,0)/al.length);
    const viejo=al.reduce((m,r)=>Math.max(m,r.dias_alerta),0);
    const b4=al.filter(r=>r.dias_alerta>60).length;
    const nD=new Set(al.map(r=>r.distribuidor_id)).size;
    s.innerHTML='<div class="strip-txt">'+
      '<div class="strip-main"><em>'+al.length+'</em> unidades sin pago en '+RNOM[REG]+
      (b4?' &mdash; <em>'+b4+'</em> rebasan 60 d\u00edas':'')+'</div>'+
      '<div class="strip-sub">Concentradas en <b>'+nD+' distribuidores</b> &middot; promedio de <b>'+prom+
      ' d\u00edas</b> sin cobrar</div></div>'+
      '<div class="strip-kpis">'+
        '<div class="sk"><div class="sk-n">'+al.length+'</div><div class="sk-l">Unidades</div></div>'+
        '<div class="sk"><div class="sk-n">'+prom+'</div><div class="sk-l">D\u00edas prom.</div></div>'+
        '<div class="sk"><div class="sk-n">'+viejo+'</div><div class="sk-l">M\u00e1s antigua</div></div>'+
        '<div class="sk"><div class="sk-n">'+nD+'</div><div class="sk-l">Dealers</div></div>'+
      '</div>';
  } else {
    const rows=MATRIX.filter(r=>r.bp>0);
    if(!rows.length){s.innerHTML='<div class="strip-txt"><div class="strip-main">Sin Business Plan cargado</div>'+
      '<div class="strip-sub">No hay BP registrado para esta regi\u00f3n.</div></div>';return}
    const act=MATRIX.filter(r=>r.bp>0||r.fac>0||r.bo>0);
    const TB=act.reduce((a,r)=>a+r.bp,0), TF=act.reduce((a,r)=>a+r.fac,0);
    const TO=act.reduce((a,r)=>a+r.bo,0), TG=act.reduce((a,r)=>a+r.gap,0);
    const TC=TB?((TF+TO)/TB*100):0;
    const tot={}; MODS.forEach(m=>{const x=act.filter(r=>r.modelo===m);
      const bp=x.reduce((a,r)=>a+r.bp,0);
      tot[m]={bp,cov:bp?((x.reduce((a,r)=>a+r.fac,0)+x.reduce((a,r)=>a+r.bo,0))/bp*100):0}});
    const peor=MODS.filter(m=>tot[m].bp>0).sort((a,b)=>tot[a].cov-tot[b].cov)[0];
    s.innerHTML='<div class="strip-txt">'+
      '<div class="strip-main">'+RNOM[REG]+' tiene <em>'+Math.round(TC)+'%</em> de su plan cubierto'+
      (peor?' &mdash; <em>'+peor+'</em> es el hueco m\u00e1s grande':'')+'</div>'+
      '<div class="strip-sub">Quedan <b>'+TG+' unidades</b> por colocar contra un plan de <b>'+TB+'</b>'+
      (peor?' &middot; '+peor+' solo tiene <b>'+Math.round(tot[peor].cov)+'%</b> cubierto':'')+'</div></div>'+
      '<div class="strip-kpis">'+
        '<div class="sk"><div class="sk-n">'+TB+'</div><div class="sk-l">Plan 2026</div></div>'+
        '<div class="sk"><div class="sk-n">'+TF+'</div><div class="sk-l">Facturado</div></div>'+
        '<div class="sk"><div class="sk-n">'+TO+'</div><div class="sk-l">En pedido</div></div>'+
        '<div class="sk"><div class="sk-n">'+TG+'</div><div class="sk-l">Por colocar</div></div>'+
      '</div>';
  }
}

/* ══ COBRANZA ══ */
function renderCob(){
  const al=COB.filter(r=>rMatch(r.distribuidor_id)&&['critico','urgente','anticipo'].includes(r.estado));
  if(!al.length){document.getElementById('pane-cob').innerHTML=
    '<div class="panel"><div class="empty"><b>Sin adeudos pendientes</b>Toda la cartera de la regi\u00f3n est\u00e1 al corriente.</div></div>';return}
  const b1=al.filter(r=>r.dias_alerta<=15), b2=al.filter(r=>r.dias_alerta>15&&r.dias_alerta<=30);
  const b3=al.filter(r=>r.dias_alerta>30&&r.dias_alerta<=60), b4=al.filter(r=>r.dias_alerta>60);

  const grupos={}; al.forEach(r=>{(grupos[r.distribuidor_id]=grupos[r.distribuidor_id]||[]).push(r)});
  const orden=Object.entries(grupos).sort((a,b)=>{
    const sc=g=>g.filter(x=>x.estado==='critico').length*1000+Math.max(...g.map(x=>x.dias_alerta));
    return sc(b[1])-sc(a[1])});

  const filas=orden.map(([did,us])=>{
    const c=us.filter(x=>x.estado==='critico').length;
    const u=us.filter(x=>x.estado==='urgente').length;
    const a=us.filter(x=>x.estado==='anticipo').length;
    const mx=Math.max(...us.map(x=>x.dias_alerta));
    const ord=us.sort((x,y)=>({critico:0,urgente:1,anticipo:2}[x.estado]-{critico:0,urgente:1,anticipo:2}[y.estado])||y.dias_alerta-x.dias_alerta);
    return '<div class="cd"><div class="cd-h" onclick="tog(this)">'+
      '<div><div class="cd-n">'+(DL[did]?DL[did].nombre:did)+'</div>'+
      '<div class="cd-r">'+us.length+' unidades pendientes</div></div>'+
      '<div class="cd-pills">'+
        (c?'<span class="pill c"><span class="mono">'+c+'</span> entregadas</span>':'')+
        (u?'<span class="pill u"><span class="mono">'+u+'</span> liberadas</span>':'')+
        (a?'<span class="pill a"><span class="mono">'+a+'</span> anticipo</span>':'')+
      '</div>'+
      '<div class="cd-max"><div class="cd-maxn" style="color:'+diasColor(mx)+'">'+mx+'d</div>'+
      '<div class="cd-maxl">M\u00c1S ANTIGUA</div></div></div>'+
      '<div class="cd-body"><div class="cd-inner">'+ord.map(r=>{
        const lb={critico:'Entregada sin pago',urgente:'Liberada sin pago',anticipo:'Anticipo parcial'}[r.estado];
        const src=r.dias_src==='lib'?'desde liberaci\u00f3n':'desde factura';
        return '<div class="ur">'+
          '<div class="ur-d"><div class="ur-dn" style="color:'+diasColor(r.dias_alerta)+'">'+r.dias_alerta+'</div>'+
          '<div class="ur-dl">D\u00cdAS</div></div>'+
          '<div class="ur-m">'+(r.familia||'')+'</div>'+
          '<div class="ur-i"><b>'+src+'</b><div class="ur-f">'+(r.folio||'')+' &middot; '+
          (r.f_liberacion||r.f_factura||'')+'</div></div>'+
          '<div class="ur-s '+r.estado+'">'+lb+'</div></div>'}).join('')+
      '</div></div></div>'}).join('');

  document.getElementById('pane-cob').innerHTML=
    '<div class="aging">'+
      ag('b1','1 &ndash; 15 d\u00edas',b1,al.length)+ag('b2','16 &ndash; 30 d\u00edas',b2,al.length)+
      ag('b3','31 &ndash; 60 d\u00edas',b3,al.length)+ag('b4','M\u00e1s de 60 d\u00edas',b4,al.length)+
    '</div>'+
    '<div class="sec"><div class="sec-h"><h3>Cartera por distribuidor</h3><div class="rule"></div>'+
      '<span>clic para ver el detalle</span></div>'+
      '<div class="panel">'+filas+'</div></div>';
}
function ag(cls,lbl,arr,tot){
  const p=tot?Math.round(arr.length/tot*100):0;
  const col={b1:'#185FA5',b2:'#C47A1A',b3:'#D35400',b4:'#C0392B'}[cls];
  return '<div class="agc '+cls+'"><div class="agc-l">'+lbl+'</div>'+
    '<div class="agc-n" style="color:'+(arr.length?col:'#C3D2E0')+'">'+arr.length+'</div>'+
    '<div class="agc-s"><b>'+p+'%</b> de la cartera</div></div>'}
function tog(el){el.nextElementSibling.classList.toggle('open')}

/* ══ BACK ORDER ══ */
function renderBO(){
  const rows=MATRIX.filter(r=>r.bp>0);
  if(!rows.length){document.getElementById('pane-bo').innerHTML=
    '<div class="panel"><div class="empty"><b>Sin Business Plan cargado</b>No hay BP registrado para esta regi\u00f3n.</div></div>';return}
  const act=MATRIX.filter(r=>r.bp>0||r.fac>0||r.bo>0);
  const tot={};
  MODS.forEach(m=>{const s=act.filter(r=>r.modelo===m);
    const bp=s.reduce((a,r)=>a+r.bp,0), fac=s.reduce((a,r)=>a+r.fac,0), bo=s.reduce((a,r)=>a+r.bo,0);
    tot[m]={bp,fac,bo,cov:bp?((fac+bo)/bp*100):0,gap:s.reduce((a,r)=>a+r.gap,0)}});

  const cards=MODS.map(m=>{const t=tot[m];
    if(!t.bp)return '<div class="mcard" style="opacity:.45"><div class="mcard-top">'+
      '<div class="mcard-mod" style="color:#C3D2E0">'+m+'</div></div>'+
      '<div class="mcard-nums" style="color:#C3D2E0">sin BP</div></div>';
    return '<div class="mcard"><div class="mcard-top"><div class="mcard-mod">'+m+'</div>'+
      '<div class="mcard-pct" style="color:'+covColor(t.cov)+'">'+Math.round(t.cov)+'%</div></div>'+
      '<div class="mcard-bar"><div class="mcard-fill" style="width:'+Math.min(100,t.cov)+'%;background:'+covColor(t.cov)+'"></div></div>'+
      '<div class="mcard-nums"><span>BP<b>'+t.bp+'</b></span><span>Fact<b>'+t.fac+'</b></span>'+
      '<span>BO<b>'+t.bo+'</b></span><span>Falta<b style="color:'+(t.gap?'#C0392B':'#1E8E5A')+'">'+t.gap+'</b></span>'+
      '</div></div>'}).join('');

  const ids=dealersReg().sort((a,b)=>{
    const c=d=>{const s=rows.filter(r=>r.did===d);return s.length?s.reduce((x,r)=>x+r.cov,0)/s.length:999};
    return c(a)-c(b)});
  const mtxH=ids.map(did=>{
    const cells=MODS.map(m=>{
      const r=MATRIX.find(x=>x.did===did&&x.modelo===m);
      if(!r||(!r.bp&&!r.fac&&!r.bo))return '<td><div class="cell na"><div class="cell-p">&mdash;</div></div></td>';
      if(!r.bp)return '<td><div class="cell na" style="cursor:pointer" onclick="verCelda(\''+did+'\',\''+m+'\')">'+
        '<div class="cell-p" style="color:#8496A8;font-size:12px">'+(r.fac+r.bo)+'</div>'+
        '<div class="cell-g" style="color:#A9B9C9">sin plan</div></div></td>';
      return '<td><div class="cell" style="background:'+covBg(r.cov)+'" onclick="verCelda(\''+did+'\',\''+m+'\')">'+
        '<div class="cell-p" style="color:'+covColor(r.cov)+'">'+Math.round(r.cov)+'%</div>'+
        (r.gap?'<div class="cell-g" style="color:'+covColor(r.cov)+'">faltan '+r.gap+'</div>':
               '<div class="cell-g" style="color:#1E8E5A">completo</div>')+'</div></td>'}).join('');
    return '<tr><td class="mtx-d"><div>'+(DL[did]?DL[did].nombre:did)+'</div>'+
      (REG==='all'?'<div class="mtx-dr">'+(DL[did].region==='israel'?'Centro-Sur':'Noroeste / Pac\u00edfico')+'</div>':'')+
      '</td>'+cells+'</tr>'}).join('');

  document.getElementById('pane-bo').innerHTML=
    '<div class="msum">'+cards+'</div>'+
    '<div class="sec"><div class="sec-h"><h3>Cobertura por distribuidor y modelo</h3><div class="rule"></div>'+
      '<span>'+ids.length+' distribuidores &middot; menor cobertura primero &middot; clic en una celda para el detalle</span></div>'+
      '<div class="panel"><div class="mtx-wrap"><table class="mtx"><thead><tr><th>Distribuidor</th>'+
      MODS.map(m=>'<th class="mh">'+m+'</th>').join('')+'</tr></thead><tbody>'+mtxH+'</tbody></table></div>'+
      '<div class="legend"><span style="font-weight:600;color:var(--mut)">Cobertura del BP:</span>'+
        '<span class="lg"><span class="lgc" style="background:#FBEAE7"></span>menos de 25%</span>'+
        '<span class="lg"><span class="lgc" style="background:#FDEDE3"></span>25 a 50%</span>'+
        '<span class="lg"><span class="lgc" style="background:#FDF3E3"></span>50 a 75%</span>'+
        '<span class="lg"><span class="lgc" style="background:#EEF5FD"></span>75 a 100%</span>'+
        '<span class="lg"><span class="lgc" style="background:#E2F4EA"></span>plan completo</span>'+
      '</div></div></div>'+
    renderBOPend();
}


/* ══ BACK ORDER PENDIENTE ══ */
function renderBOPend(){
  const ids=new Set(dealersReg());
  const uds=BOR.filter(r=>ids.has(r.distribuidor_id));
  if(!uds.length)return '<div class="sec"><div class="sec-h"><h3>Back order pendiente</h3><div class="rule"></div></div>'+
    '<div class="panel"><div class="empty"><b>Sin back order</b>No hay pedidos pendientes en esta regi\u00f3n.</div></div></div>';

  const G={};
  uds.forEach(r=>{
    const k=r.folio||'(sin folio)';
    if(!G[k])G[k]={folio:k,did:r.distribuidor_id,plaza:r.plaza||'',fecha:r.fecha_solicitud||'',
      obs:r.obs||'',ref:r.referencia||'',est:r.estatus_bo||'',mods:{},u:0};
    const f=r.modelo_familia||'?';
    G[k].mods[f]=(G[k].mods[f]||0)+(r.unidades||1);
    G[k].u+=(r.unidades||1);
    if(!G[k].obs&&r.obs)G[k].obs=r.obs;
    if(!G[k].ref&&r.referencia)G[k].ref=r.referencia;
  });
  const lista=Object.values(G).map(g=>Object.assign({},g,{dias:diasDesde(g.fecha)}))
    .sort((a,b)=>(b.dias||0)-(a.dias||0));

  const b1=uds.filter(r=>{const d=diasDesde(r.fecha_solicitud);return d!==null&&d<=30}).length;
  const b2=uds.filter(r=>{const d=diasDesde(r.fecha_solicitud);return d>30&&d<=90}).length;
  const b3=uds.filter(r=>{const d=diasDesde(r.fecha_solicitud);return d>90&&d<=180}).length;
  const b4=uds.filter(r=>{const d=diasDesde(r.fecha_solicitud);return d>180}).length;
  const prom=Math.round(uds.reduce((a,r)=>a+(diasDesde(r.fecha_solicitud)||0),0)/uds.length);

  const agc=(cls,lbl,n)=>{
    const col={b1:'#185FA5',b2:'#C47A1A',b3:'#D35400',b4:'#C0392B'}[cls];
    const p=uds.length?Math.round(n/uds.length*100):0;
    return '<div class="agc '+cls+'"><div class="agc-l">'+lbl+'</div>'+
      '<div class="agc-n" style="color:'+(n?col:'#C3D2E0')+'">'+n+'</div>'+
      '<div class="agc-s"><b>'+p+'%</b> del back order</div></div>'};

  const filas=lista.map(g=>{
    const mods=Object.entries(g.mods).sort((a,b)=>MODS.indexOf(a[0])-MODS.indexOf(b[0]))
      .map(function(e){return '<span class="bo-chip">'+e[0]+(e[1]>1?' \u00d7'+e[1]:'')+'</span>'}).join('');
    const mes=mesEstimado(g.obs)||mesEstimado(g.ref);
    const refRedundante=mes&&g.ref&&g.ref.replace(/[^A-Za-z]/g,'').toUpperCase()===mes.toUpperCase();
    const verRef=g.ref&&!refRedundante;
    const nota=(mes?'<span class="bo-mes">'+mes+'</span>':'')+
      (g.obs?'<b>'+g.obs+'</b>':'')+
      (verRef?((g.obs?'<br>':'')+'<span class="bo-ref">Ref '+g.ref+'</span>'):'');
    return '<div class="bo-row">'+
      '<div class="bo-age"><div class="bo-age-n" style="color:'+ageColor(g.dias||0)+'">'+(g.dias!==null?g.dias:'\u2014')+'</div>'+
      '<div class="bo-age-l">D\u00cdAS</div></div>'+
      '<div><div class="bo-dl">'+(DL[g.did]?DL[g.did].nombre:g.did)+'</div>'+
      '<div class="bo-pl">'+(g.plaza||'')+(g.est?' \u00b7 '+g.est:'')+'</div></div>'+
      '<div class="bo-mods">'+mods+'</div>'+
      '<div><div class="bo-fec">'+(g.fecha||'')+'</div><div class="bo-fol">'+g.folio+'</div></div>'+
      '<div class="bo-note">'+(nota||'<span style="color:#B9C7D6">\u2014</span>')+'</div>'+
    '</div>'}).join('');

  return '<div class="aging">'+
      agc('b1','0 &ndash; 30 d\u00edas',b1)+agc('b2','31 &ndash; 90 d\u00edas',b2)+
      agc('b3','91 &ndash; 180 d\u00edas',b3)+agc('b4','M\u00e1s de 180 d\u00edas',b4)+
    '</div>'+
    '<div class="sec"><div class="sec-h"><h3>Back order pendiente</h3><div class="rule"></div>'+
      '<span>'+uds.length+' unidades en '+lista.length+(lista.length===1?' pedido':' pedidos')+' \u00b7 antig\u00fcedad promedio '+prom+' d\u00edas</span></div>'+
      '<div class="panel">'+
      '<div class="bo-hd"><span>Antig.</span><span>Distribuidor</span><span>Modelos</span>'+
      '<span>Solicitado</span><span>Observaci\u00f3n / referencia</span></div>'+
      filas+'</div></div>';
}

function verCelda(did,mod){
  const r=MATRIX.find(x=>x.did===did&&x.modelo===mod); if(!r)return;

  const ESTLBL={pagado:'Pagado',critico:'Entregada s/pago',urgente:'Liberada s/pago',
    anticipo:'Anticipo',pendiente:'Sin pago'};
  const fac=COB.filter(x=>x.distribuidor_id===did&&x.familia===mod)
    .sort((a,b)=>parseF(b.f_factura)-parseF(a.f_factura));
  const facH=fac.length?fac.map(u=>
    '<div class="iv"><span class="iv-f">'+(u.folio||'\u2014')+'</span>'+
    '<span class="iv-v">'+(u.vin||'\u2014')+'</span>'+
    '<span class="iv-d">'+(u.f_factura||'')+'</span>'+
    '<span class="iv-s '+u.estado+'">'+(ESTLBL[u.estado]||u.estado)+
      (u.estado!=='pagado'&&u.dias_alerta?' \u00b7 '+u.dias_alerta+'d':'')+'</span></div>').join('')
    :'<div class="empty" style="padding:18px">Sin unidades facturadas de este modelo en 2026.</div>';

  const bo=r.folios.slice().sort((a,b)=>parseF(b.fecha)-parseF(a.fecha));
  const boH=bo.length?bo.map(f=>{
    const d=diasDesde(f.fecha), mes=mesEstimado(f.obs)||mesEstimado(f.ref);
    return '<div class="iv"><span class="iv-f">'+(f.folio||'\u2014')+'</span>'+
      '<span class="iv-v">'+f.modelo+(f.plaza?' \u00b7 '+f.plaza:'')+
      (mes?' <span class="bo-mes">'+mes+'</span>':'')+
      (f.obs?'<br><span style="color:var(--ink);font-weight:600">'+f.obs+'</span>':'')+'</span>'+
      '<span class="iv-d">'+(f.fecha||'')+'</span>'+
      '<span class="iv-s pendiente" style="color:'+ageColor(d||0)+'">'+(d!==null?d+' d\u00edas':'\u2014')+'</span></div>'}).join('')
    :'<div class="empty" style="padding:18px">Sin pedidos colocados para este modelo.</div>';

  document.getElementById('mbox').innerHTML=
    '<div class="mbox-h"><div><div class="mbox-t">'+(DL[did]?DL[did].nombre:did)+' &middot; '+mod+'</div>'+
    '<div class="mbox-s">'+(r.cov!==null?Math.round(r.cov)+'% del plan cubierto':'Sin plan asignado para este modelo')+'</div></div>'+
    '<button class="mx" onclick="cerrarModal()">&times;</button></div>'+
    '<div class="mbox-b"><div class="mstat">'+
      '<div class="ms"><div class="ms-n">'+r.bp+'</div><div class="ms-l">Plan</div></div>'+
      '<div class="ms"><div class="ms-n" style="color:#185FA5">'+r.fac+'</div><div class="ms-l">Facturado</div></div>'+
      '<div class="ms"><div class="ms-n" style="color:#1E8E5A">'+r.bo+'</div><div class="ms-l">En pedido</div></div>'+
      '<div class="ms"><div class="ms-n" style="color:'+(r.gap?'#C0392B':'#1E8E5A')+'">'+r.gap+'</div><div class="ms-l">Falta</div></div>'+
    '</div>'+
    '<div class="msec">Facturado 2026<div class="rule"></div><span>'+fac.length+(fac.length===1?' unidad':' unidades')+'</span></div>'+facH+
    '<div class="msec">Back order<div class="rule"></div><span>'+bo.length+(bo.length===1?' unidad':' unidades')+'</span></div>'+boH+
    '</div>';
  document.getElementById('modal').classList.add('on');
}
function cerrarModal(){document.getElementById('modal').classList.remove('on')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')cerrarModal()});

function setTab(t){TAB=t;
  document.getElementById('tab-cob').classList.toggle('on',t==='cob');
  document.getElementById('tab-bo').classList.toggle('on',t==='bo');
  document.getElementById('pane-cob').style.display=t==='cob'?'':'none';
  document.getElementById('pane-bo').style.display=t==='bo'?'':'none';
  renderStrip();
}
function setRegion(r){REG=r;
  document.querySelectorAll('.rbtn').forEach(b=>b.classList.toggle('on',b.dataset.r===r));
  document.getElementById('reglbl').textContent=RLBL[r]+' \u00b7 '+RSUB[r];
  render();window.scrollTo({top:0,behavior:'smooth'});
}
async function actualizar(){
  const b=document.getElementById('btnr');
  document.getElementById('ov').classList.add('on'); b.classList.add('load');
  try{await cargar();toast('Datos actualizados')}catch(e){toast('Error al actualizar',1)}
  finally{document.getElementById('ov').classList.remove('on');b.classList.remove('load')}
}

document.getElementById('reglbl').textContent=RLBL.israel+' \u00b7 '+RSUB.israel;
document.getElementById('ov').classList.add('on');
cargar().then(()=>document.getElementById('ov').classList.remove('on'))
  .catch(e=>{document.getElementById('ov').classList.remove('on');toast('Error: '+e.message,1)});
</script>
