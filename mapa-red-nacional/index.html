<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Foton · Red Nacional de Distribuidores</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #050f24;
    --panel: #0b1d3d;
    --panel-2: #0f2549;
    --line: rgba(148,178,224,0.14);
    --text: #eaf0fb;
    --muted: #7c8dae;
    --dist: #29c5ff;      /* azul celeste - distribuidor Foton */
    --dist-glow: rgba(41,197,255,0.45);
    --taller: #ffd400;    /* amarillo - taller aliado */
    --taller-glow: rgba(255,212,0,0.45);
    --gold: #ffb020;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;overflow:hidden;}

  #app{position:relative;height:100vh;width:100vw;}
  #map{position:absolute;inset:0;filter:saturate(1.05);}

  /* ---- Top HUD bar ---- */
  #topbar{
    position:absolute; top:0; left:0; right:0; z-index:1000;
    padding:16px 16px 40px;
    background:linear-gradient(180deg, rgba(5,15,36,0.96) 0%, rgba(5,15,36,0.65) 70%, transparent 100%);
    pointer-events:none;
  }
  #topbar > *{pointer-events:auto;}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .brand-mark{
    height:30px; width:auto; object-fit:contain;
    filter:drop-shadow(0 0 10px rgba(41,197,255,0.35));
  }
  .brand-text{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:15px;letter-spacing:0.06em;line-height:1.1;}
  .brand-text span{display:block;font-family:'Inter',sans-serif;font-weight:500;font-size:10.5px;letter-spacing:0.08em;color:var(--muted);text-transform:uppercase;margin-top:2px;}

  .search-row{display:flex;gap:8px;}
  .search-box{
    flex:1;display:flex;align-items:center;gap:8px;
    background:rgba(11,29,61,0.9); border:1px solid var(--line);
    border-radius:12px; padding:10px 14px; backdrop-filter:blur(10px);
  }
  .search-box input{
    background:none;border:none;outline:none;color:var(--text);font-family:'Inter';font-size:13.5px;width:100%;
  }
  .search-box input::placeholder{color:var(--muted);}
  .search-box svg{flex-shrink:0;}

  .stat-chip{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:rgba(11,29,61,0.9); border:1px solid var(--line); border-radius:12px;
    padding:6px 12px; min-width:56px; backdrop-filter:blur(10px);
  }
  .stat-chip b{font-family:'JetBrains Mono',monospace; font-size:15px; line-height:1;}
  .stat-chip small{font-size:9px; color:var(--muted); text-transform:uppercase; letter-spacing:0.05em; margin-top:2px;}

  /* ---- Filter pills ---- */
  #filters{
    position:absolute; top:112px; left:16px; right:16px; z-index:999;
    display:flex; gap:8px; overflow-x:auto; padding-bottom:2px;
  }
  #filters::-webkit-scrollbar{display:none;}
  .pill{
    display:flex; align-items:center; gap:7px; white-space:nowrap;
    padding:8px 14px; border-radius:999px; font-size:12.5px; font-weight:600;
    background:rgba(11,29,61,0.92); border:1px solid var(--line); color:var(--muted);
    backdrop-filter:blur(10px); cursor:pointer; transition:all .15s ease;
    font-family:'Inter';
  }
  .pill .dot{width:8px;height:8px;border-radius:50%;}
  .pill.active-dist{color:#fff;border-color:var(--dist);background:rgba(41,197,255,0.16);box-shadow:0 0 14px rgba(41,197,255,0.25) inset;}
  .pill.active-taller{color:#fff;border-color:var(--taller);background:rgba(255,212,0,0.14);box-shadow:0 0 14px rgba(255,212,0,0.22) inset;}
  .pill.dim{opacity:0.45;}

  /* ---- Custom markers ---- */
  .mk-dist, .mk-taller{position:relative;display:flex;align-items:center;justify-content:center;}
  .mk-dist .core{
    width:30px;height:30px;border-radius:9px;background:linear-gradient(145deg,#ff4553,#c8001a);
    display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Rajdhani';font-weight:700;font-size:13px;
    box-shadow:0 0 0 3px rgba(41,197,255,0.22), 0 4px 10px rgba(0,0,0,0.5);
    border:1.5px solid rgba(255,255,255,0.35);
  }
  .mk-taller .core{
    width:26px;height:26px;border-radius:50%;background:linear-gradient(145deg,#ffe873,#f5b300);
    display:flex;align-items:center;justify-content:center;color:#04241f;
    box-shadow:0 0 0 3px rgba(255,212,0,0.22), 0 4px 10px rgba(0,0,0,0.5);
    border:1.5px solid rgba(255,255,255,0.35);
  }
  .pulse{
    position:absolute; inset:-8px; border-radius:inherit; opacity:0.55;
    animation:pulse 2.2s ease-out infinite;
  }
  .mk-dist .pulse{background:var(--dist-glow); border-radius:11px;}
  .mk-taller .pulse{background:var(--taller-glow); border-radius:50%;}
  @keyframes pulse{
    0%{transform:scale(0.7);opacity:0.5;}
    70%{transform:scale(1.9);opacity:0;}
    100%{opacity:0;}
  }
  .leaflet-div-icon{background:none;border:none;}

  /* ---- Bottom sheet ---- */
  @keyframes scanbar{0%{background-position:-120% 0;}100%{background-position:220% 0;}}
  @keyframes blinkdot{0%,100%{opacity:1;box-shadow:0 0 8px currentColor;}50%{opacity:0.3;box-shadow:0 0 2px currentColor;}}
  @keyframes sheetIn{from{opacity:0; transform:translateY(10px);}to{opacity:1; transform:translateY(0);}}

  #sheet{
    --accent: var(--dist);
    position:absolute; left:0; right:0; bottom:0; z-index:1100;
    background:linear-gradient(180deg,var(--panel-2),var(--panel));
    border-top:1px solid var(--line);
    border-radius:20px 20px 0 0;
    box-shadow:0 -12px 40px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.03) inset;
    transform:translateY(105%);
    transition:transform .32s cubic-bezier(.2,.9,.25,1);
    max-height:80vh;
    display:flex; flex-direction:column;
    overflow:hidden;
  }
  #sheet::before{
    content:''; position:absolute; top:0; left:0; right:0; height:3px; z-index:2;
    background:linear-gradient(90deg, transparent, var(--accent), #fff, var(--accent), transparent);
    background-size:220% 100%;
    animation:scanbar 2.6s linear infinite;
    opacity:0.9;
  }
  #sheet.type-taller{--accent:var(--taller);}
  #sheet.type-dist{--accent:var(--dist);}
  #sheet.open{transform:translateY(0);}
  #sheet.open .sheet-scroll{animation:sheetIn .4s ease both;}
  .sheet-handle{width:38px;height:4px;border-radius:3px;background:var(--line);margin:10px auto 4px;position:relative;z-index:1;flex-shrink:0;}
  .sheet-scroll{
    overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain;
    padding:4px 20px 14px;
    flex:1 1 auto; min-height:0;
  }
  .sheet-footer{
    flex-shrink:0; padding:12px 20px calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg, transparent, var(--panel) 30%);
    border-top:1px solid var(--line);
  }

  .sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding-top:12px;position:relative;}
  .sheet-head::before,.sheet-head::after{
    content:''; position:absolute; top:0; width:14px; height:9px; opacity:0.55; pointer-events:none;
  }
  .sheet-head::before{left:-4px; border-top:2px solid var(--accent); border-left:2px solid var(--accent);}
  .sheet-head::after{right:-4px; border-top:2px solid var(--accent); border-right:2px solid var(--accent);}

  .sheet-tag{
    display:inline-flex;align-items:center;gap:7px;font-family:'JetBrains Mono';font-size:10.5px;
    letter-spacing:0.08em; text-transform:uppercase; padding:5px 12px 5px 10px; margin-bottom:9px;
    background:color-mix(in srgb, var(--accent) 14%, transparent);
    border:1px solid color-mix(in srgb, var(--accent) 45%, transparent);
    color:var(--accent);
    clip-path:polygon(0 0,calc(100% - 9px) 0,100% 100%,9px 100%);
  }
  .sheet-tag::before{
    content:''; width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0;
    animation:blinkdot 1.5s ease-in-out infinite;
  }
  .sheet-title{font-family:'Rajdhani';font-weight:700;font-size:21px;line-height:1.15;}
  .sheet-sub{color:var(--muted);font-size:12.5px;margin-top:3px;}
  .close-btn{
    width:30px;height:30px;border-radius:50%;background:rgba(148,178,224,0.1);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;color:var(--muted);flex-shrink:0;cursor:pointer;
  }

  .contact-card{
    position:relative; display:flex; align-items:center; gap:12px;
    background:linear-gradient(120deg, color-mix(in srgb, var(--accent) 8%, transparent), rgba(148,178,224,0.04));
    border:1px solid var(--line); border-left:3px solid var(--accent);
    clip-path:polygon(0 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%);
    padding:12px 14px; margin-top:10px;
  }
  .contact-ico{
    width:38px;height:38px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:16px;
    background:rgba(255,255,255,0.06);
    clip-path:polygon(20% 0,100% 0,100% 80%,80% 100%,0 100%,0 20%);
  }
  .contact-role{font-size:10.5px;text-transform:uppercase;letter-spacing:0.06em;color:var(--muted);font-weight:600;}
  .contact-name{font-size:14.5px;font-weight:600;margin-top:1px;}
  .contact-phone{font-family:'JetBrains Mono';font-size:12px;color:var(--gold);margin-top:2px;}

  .meta-row{display:flex;gap:8px;margin-top:14px;color:var(--muted);font-size:12.5px;align-items:flex-start;}
  .coord-row{
    display:flex; align-items:center; gap:6px; margin-top:7px;
    font-family:'JetBrains Mono'; font-size:10.5px; letter-spacing:0.02em;
    color:var(--accent); opacity:0.85;
  }
  .geo-warn{
    margin-top:10px; font-size:11px; font-weight:600; color:var(--gold);
    background:rgba(255,176,32,0.1); border:1px solid rgba(255,176,32,0.3);
    padding:6px 10px; display:inline-block;
    clip-path:polygon(0 0,calc(100% - 8px) 0,100% 100%,8px 100%);
  }
  .meta-row svg{flex-shrink:0;margin-top:1px;}

  .cta-row{display:flex;gap:10px;margin-top:18px;}
  .btn{
    flex:1; display:flex; align-items:center; justify-content:center; gap:8px;
    padding:13px; font-weight:700; font-size:13.5px; font-family:'Inter'; letter-spacing:0.02em;
    border:none; cursor:pointer; text-decoration:none;
    clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);
  }
  .btn-primary{background:linear-gradient(135deg,var(--gold),#e08a00); color:#241500; box-shadow:0 4px 20px -6px rgba(255,176,32,0.6);}
  .btn-ghost{background:rgba(148,178,224,0.08); color:var(--text); border:1px solid var(--accent);}

  #scrim{position:absolute;inset:0;background:rgba(0,0,0,0.35);opacity:0;pointer-events:none;transition:opacity .3s;z-index:1050;}
  #scrim.show{opacity:1;pointer-events:auto;}

  .leaflet-control-zoom{display:none;}
  .leaflet-control-attribution{
    background:rgba(5,15,36,0.55)!important; color:var(--muted)!important;
    font-size:8.5px!important; padding:1px 6px!important; border-radius:6px!important;
    margin-bottom:44px!important; border:none!important;
  }
  .leaflet-control-attribution a{color:var(--muted)!important;}

  #footerbar{
    position:absolute; bottom:0; left:0; right:0; z-index:900;
    display:flex; align-items:center; justify-content:center; gap:8px;
    padding:9px 12px 12px;
    background:linear-gradient(0deg, rgba(5,15,36,0.92) 20%, transparent 100%);
    pointer-events:none;
  }
  #footerbar img{height:13px; opacity:0.85; filter:brightness(0) invert(1);}
  #footerbar span{font-family:'Inter'; font-size:10.5px; color:var(--muted); letter-spacing:0.02em;}

  /* ---- Foton brand marker (distribuidor) ---- */
  .mk-dist .core{
    width:36px;height:36px;border-radius:11px;
    background:linear-gradient(145deg,#12203f,#050f24);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 0 3px rgba(41,197,255,0.32), 0 4px 14px rgba(0,0,0,0.6);
    border:1.5px solid var(--dist);
    padding:6px;
  }
  .mk-dist .core img{width:100%;height:100%;object-fit:contain;}

  /* ---- Equipo aliado (taller) team rows ---- */
  .team-section{margin-top:16px;}
  .team-label{font-size:10.5px;text-transform:uppercase;letter-spacing:0.06em;color:var(--muted);font-weight:600;margin-bottom:8px;}
  .team-member{
    display:flex;align-items:center;gap:11px;
    padding:10px 12px; border-radius:12px; background:rgba(148,178,224,0.05);
    border:1px solid var(--line); margin-bottom:8px;
  }
  .avatar{
    width:34px;height:34px;border-radius:50%;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-family:'Rajdhani';font-weight:700;font-size:13px;color:#04241f;
    background:linear-gradient(145deg,#ffe873,#f5b300);
  }
  .member-name{font-size:13.5px;font-weight:600;line-height:1.25;}
  .member-role{font-size:11px;color:var(--muted);margin-top:1px;}
</style>
</head>

function iconFor(p){
  const html = p.tipo === 'distribuidor'
    ? `<div class="mk-dist"><div class="pulse"></div><div class="core"><img src="${FOTON_LOGO}" alt=""></div></div>`
    : `<div class="mk-taller"><div class="pulse"></div><div class="core">
         <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#04241f" stroke-width="2.4"><path d="M14.7 6.3a4 4 0 0 0-5.6 5.6L2 19l3 3 7.1-7.1a4 4 0 0 0 5.6-5.6l-2.8 2.8-2-2z"/></svg>
       </div></div>`;
  return L.divIcon({html, className:'leaflet-div-icon', iconSize:[34,34], iconAnchor:[17,17]});
}

const markers = [];
allPoints.forEach(p=>{
  const m = L.marker([p.lat,p.lng], {icon:iconFor(p)}).addTo(map);
  m.on('click', ()=>openSheet(p));
  markers.push({point:p, marker:m});
});

document.getElementById('cDist').textContent = distribuidores.length;
document.getElementById('cTaller').textContent = talleres.length;
document.getElementById('countTotal').textContent = allPoints.length;

// ---------------- FILTROS ----------------
let showDist = true, showTaller = true;
function applyFilter(){
  markers.forEach(({point,marker})=>{
    const visible = (point.tipo==='distribuidor' && showDist) || (point.tipo==='taller' && showTaller);
    const el = marker.getElement();
    if(el) el.style.display = visible ? '' : 'none';
  });
  document.getElementById('countTotal').textContent =
    markers.filter(({point})=> (point.tipo==='distribuidor'&&showDist)||(point.tipo==='taller'&&showTaller)).length;
}
document.getElementById('pillDist').onclick = ()=>{
  showDist = !showDist;
  document.getElementById('pillDist').classList.toggle('active-dist', showDist);
  document.getElementById('pillDist').classList.toggle('dim', !showDist);
  applyFilter();
};
document.getElementById('pillTaller').onclick = ()=>{
  showTaller = !showTaller;
  document.getElementById('pillTaller').classList.toggle('active-taller', showTaller);
  document.getElementById('pillTaller').classList.toggle('dim', !showTaller);
  applyFilter();
};

document.getElementById('searchInput').addEventListener('input', (e)=>{
  const q = e.target.value.trim().toLowerCase();
  markers.forEach(({point,marker})=>{
    const match = !q || point.ciudad.toLowerCase().includes(q) || point.estado.toLowerCase().includes(q) || point.nombre.toLowerCase().includes(q);
    const typeOk = (point.tipo==='distribuidor' && showDist) || (point.tipo==='taller' && showTaller);
    const el = marker.getElement();
    if(el) el.style.display = (match && typeOk) ? '' : 'none';
  });
});

// ---------------- BOTTOM SHEET ----------------
const sheet = document.getElementById('sheet');
const scrim = document.getElementById('scrim');
const content = document.getElementById('sheetContent');
const footer = document.getElementById('sheetFooter');

function mapsUrl(p){
  return `https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}`;
}
function telUrl(t){ return t ? `tel:${t.replace(/\s+/g,'')}` : '#'; }
function phoneLabel(t){ return t || 'Sin teléfono registrado'; }
function callBtn(label, tel){
  if(!tel) return `<button class="btn btn-ghost" disabled style="opacity:0.4;cursor:not-allowed;">📞 ${label}</button>`;
  return `<a class="btn btn-ghost" href="${telUrl(tel)}">📞 ${label}</a>`;
}
function geocodeBadge(p){
  if(p.geocode === 'exact') return '';
  const label = p.geocode === 'approx' ? 'Ubicación aproximada' : 'Ubicación a nivel ciudad · verificar';
  return `<div class="geo-warn">📍 ${label}</div>`;
}

function coordRow(p){
  return `<div class="coord-row">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
    ${p.lat.toFixed(5)}, ${p.lng.toFixed(5)}
  </div>`;
}

function openSheet(p){
  map.flyTo([p.lat,p.lng], 12, {duration:0.6});
  sheet.classList.remove('type-dist','type-taller');
  sheet.classList.add(p.tipo==='distribuidor' ? 'type-dist' : 'type-taller');
  if(p.tipo==='distribuidor'){
    content.innerHTML = `
      <div class="sheet-head">
        <div style="display:flex;gap:12px;align-items:flex-start;">
          <img src="${FOTON_LOGO}" alt="Foton" style="width:42px;height:42px;object-fit:contain;background:linear-gradient(145deg,#12203f,#050f24);border:1.5px solid var(--dist);border-radius:11px;padding:7px;flex-shrink:0;box-shadow:0 0 0 3px rgba(41,197,255,0.24);">
          <div>
            <div class="sheet-tag tag-dist">● Distribuidor Foton</div>
            <div class="sheet-title">${p.nombre}</div>
            <div class="sheet-sub">${p.grupo || ''} · ${p.ciudad}, ${p.estado}</div>
          </div>
        </div>
        <div class="close-btn" onclick="closeSheet()">✕</div>
      </div>
      ${geocodeBadge(p)}

      <div class="contact-card">
        <div class="contact-ico" style="background:rgba(41,197,255,0.14)">🔧</div>
        <div>
          <div class="contact-role">Responsable de Servicio</div>
          <div class="contact-name">${p.servicio.nombre}</div>
          <div class="contact-phone">${phoneLabel(p.servicio.tel)}</div>
        </div>
      </div>
      <div class="contact-card">
        <div class="contact-ico" style="background:rgba(255,176,32,0.14)">⚙️</div>
        <div>
          <div class="contact-role">Responsable de Refacciones</div>
          <div class="contact-name">${p.refacciones.nombre}</div>
          <div class="contact-phone">${phoneLabel(p.refacciones.tel)}</div>
        </div>
      </div>

      <div class="meta-row">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#7c8dae" stroke-width="2"><path d="M21 10c0 7-9 12-9 12s-9-5-9-12a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
        ${p.direccion || 'Dirección no registrada'}
      </div>
      ${coordRow(p)}`;
    footer.innerHTML = `<div class="cta-row">
        ${callBtn('Servicio', p.servicio.tel)}
        <a class="btn btn-primary" target="_blank" href="${mapsUrl(p)}">➤ Cómo llegar</a>
      </div>`;
  } else {
    const nombresLimpios = (p.contacto.nombre||'No registrado').split('/').map(n=>n.trim()).filter(Boolean);
    content.innerHTML = `
      <div class="sheet-head">
        <div>
          <div class="sheet-tag tag-taller">● Taller Aliado</div>
          <div class="sheet-title">${p.nombre}</div>
          <div class="sheet-sub">${p.ciudad}, ${p.estado} · ${p.tipoMtto}</div>
        </div>
        <div class="close-btn" onclick="closeSheet()">✕</div>
      </div>
      ${geocodeBadge(p)}

      <div class="team-section">
        <div class="team-label">Equipo Aliado</div>
        ${nombresLimpios.map(n=>{
          const initials = n.split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase() || '·';
          const role = /due[ñn]o/i.test(n) ? 'Dueño' : /supervisor/i.test(n) ? 'Supervisor' : 'Contacto de taller';
          return `<div class="team-member">
            <div class="avatar">${initials}</div>
            <div>
              <div class="member-name">${n.replace(/\s*\((due[ñn]o|supervisor)\)\s*/i,'')}</div>
              <div class="member-role">${role} · ${phoneLabel(p.contacto.tel)}</div>
            </div>
          </div>`;
        }).join('')}
      </div>

      <div class="meta-row">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#7c8dae" stroke-width="2"><path d="M21 10c0 7-9 12-9 12s-9-5-9-12a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
        ${p.direccion || 'Dirección no registrada'}
      </div>
      ${coordRow(p)}`;
    footer.innerHTML = `<div class="cta-row">
        ${callBtn('Llamar', p.contacto.tel)}
        <a class="btn btn-primary" target="_blank" href="${mapsUrl(p)}">➤ Cómo llegar</a>
      </div>`;
  }
  sheet.classList.add('open');
  scrim.classList.add('show');
}
function closeSheet(){
  sheet.classList.remove('open');
  scrim.classList.remove('show');
}
scrim.onclick = closeSheet;
</script>
</body>
</html>
