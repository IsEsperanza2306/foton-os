<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Foton · Panel de Seguimiento MDT/LDT</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F7FB; --card:#FFFFFF; --ice:#EEF5FD;
  --deep:#002870; --navy:#042C53; --blue:#185FA5; --sky:#4A90D9; --tab:#0B4FA8;
  --ink:#1B2733; --mut:#5B6B7C; --dim:#8496A8;
  --line:#D6E4F2; --line2:#E8EFF7;
  --red:#C0392B;  --red-bg:#FBEAE7;
  --org:#D35400;  --org-bg:#FDEDE3;
  --amb:#C47A1A;  --amb-bg:#FDF3E3;
  --blu:#185FA5;  --blu-bg:#EEF5FD;
  --grn:#1E8E5A;  --grn-bg:#E2F4EA;
  --pur:#8E44AD;  --pur-bg:#F5EEF8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{font-family:Inter,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.mono{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}

header{background:linear-gradient(180deg,#00214F,var(--deep));padding:13px 24px;
  display:flex;align-items:center;gap:18px}
.logo{height:24px;width:auto;flex-shrink:0}
.hdiv{width:1px;height:24px;background:rgba(255,255,255,.22)}
.htitle .t1{font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:700;
  letter-spacing:.4px;line-height:1;color:#fff}
.htitle .t2{font-size:9.5px;color:rgba(255,255,255,.55);letter-spacing:1.5px;font-weight:600;margin-top:3px}
.hspace{flex:1}
.refresh{width:32px;height:32px;border-radius:7px;border:1px solid rgba(255,255,255,.25);
  background:rgba(255,255,255,.08);color:rgba(255,255,255,.8);cursor:pointer;font-size:14px;transition:.14s}
.refresh:hover{background:#fff;color:var(--deep)}
.refresh.load{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.navlink{color:rgba(255,255,255,.7);font-size:11.5px;font-weight:600;text-decoration:none;
  border:1px solid rgba(255,255,255,.25);padding:7px 13px;border-radius:7px;transition:.14s;white-space:nowrap}
.navlink:hover{background:#fff;color:var(--deep)}

.tabbar{display:flex;background:var(--tab);padding:0 24px}
.tab{padding:12px 22px;border:0;background:none;color:rgba(255,255,255,.6);font-family:Inter;
  font-size:13px;font-weight:600;cursor:pointer;border-bottom:3px solid transparent;
  transition:.14s;display:flex;align-items:center;gap:8px}
.tab:hover{color:rgba(255,255,255,.9)}
.tab.on{color:#fff;border-bottom-color:#fff}
.tbadge{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;padding:2px 6px;
  border-radius:5px;background:rgba(255,255,255,.18);color:#fff}

.strip{background:linear-gradient(100deg,#0B57B5 0%,#2E7FD4 60%,#4A90D9 100%);
  padding:17px 24px;display:flex;align-items:center;gap:26px;flex-wrap:wrap}
.strip-main{font-family:'Barlow Condensed',sans-serif;font-size:25px;font-weight:700;
  color:#fff;line-height:1.15;letter-spacing:.2px}
.strip-sub{font-size:12px;color:rgba(255,255,255,.8);margin-top:4px;line-height:1.45}
.strip-txt{flex:1;min-width:220px}
.strip-kpis{display:flex;gap:0;flex-shrink:0}
.sk{padding:0 20px;border-left:1px solid rgba(255,255,255,.22);text-align:center}
.sk:first-child{border-left:0;padding-left:0}
.sk-n{font-family:'Barlow Condensed',sans-serif;font-size:27px;font-weight:800;color:#fff;line-height:1}
.sk-l{font-size:9px;color:rgba(255,255,255,.7);font-weight:600;letter-spacing:.7px;
  text-transform:uppercase;margin-top:3px}

main{padding:20px 24px 60px;max-width:1400px;margin:0 auto}

.sec{margin-bottom:16px}
.sec-h{display:flex;align-items:center;gap:12px;margin-bottom:9px}
.sec-h h3{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;
  text-transform:uppercase;letter-spacing:1.2px;color:var(--mut);white-space:nowrap}
.sec-h .rule{flex:1;height:1px;background:var(--line)}
.sec-h span{font-size:11px;color:var(--dim);white-space:nowrap}

.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;
  box-shadow:0 1px 3px rgba(4,44,83,.05)}

.filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.fbtn{background:var(--card);border:1px solid var(--line);color:var(--mut);border-radius:999px;
  padding:7px 14px;font-size:12px;font-weight:600;cursor:pointer;transition:.14s}
.fbtn.on{background:var(--deep);border-color:var(--deep);color:#fff}

.dcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.dcard{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:14px 16px;
  box-shadow:0 1px 3px rgba(4,44,83,.05);cursor:pointer;transition:.15s;border-left:4px solid var(--line)}
.dcard:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(4,44,83,.12)}
.dcard.st-rojo{border-left-color:var(--red)}
.dcard.st-amarillo{border-left-color:var(--amb)}
.dcard.st-verde{border-left-color:var(--grn)}
.dc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px}
.dc-name{font-size:13.5px;font-weight:600;color:var(--navy);line-height:1.25}
.dc-plaza{font-size:10.5px;color:var(--dim);margin-top:2px}
.dc-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:3px}
.dc-dot.rojo{background:var(--red)}
.dc-dot.amarillo{background:var(--amb)}
.dc-dot.verde{background:var(--grn)}
.dc-pills{display:flex;flex-wrap:wrap;gap:5px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:6px;font-size:10.5px;font-weight:600}
.pill.c{background:var(--red-bg);color:var(--red)}
.pill.u{background:var(--amb-bg);color:var(--amb)}
.pill.a{background:var(--pur-bg);color:var(--pur)}
.pill.g{background:var(--grn-bg);color:var(--grn)}
.pill.b{background:var(--blu-bg);color:var(--blue)}
.pill.n{background:#F0F3F7;color:var(--mut)}

.vtable{width:100%;border-collapse:separate;border-spacing:0}
.vtable th{background:var(--ice);font-size:9.5px;font-weight:700;color:var(--mut);text-transform:uppercase;
  letter-spacing:.8px;padding:9px 14px;text-align:left;border-bottom:1px solid var(--line)}
.vtable td{padding:11px 14px;border-bottom:1px solid var(--line2);font-size:12.5px;color:var(--ink)}
.vtable tr:last-child td{border-bottom:0}
.vtable tr:hover td{background:#FAFCFE}
.vtable .nm{font-weight:600;color:var(--navy)}
.vtable .sub{font-size:10px;color:var(--dim);margin-top:1px}

.bo-dealer{border-bottom:1px solid var(--line)}
.bo-dealer:last-child{border-bottom:0}
.bo-dh{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:16px;
  padding:12px 18px;cursor:pointer;transition:background .12s}
.bo-dh:hover{background:var(--ice)}
.bo-dn{font-size:13.5px;font-weight:600;color:var(--navy)}
.bo-dr{font-size:10px;color:var(--dim);margin-top:2px}
.bo-dsummary{display:flex;gap:6px;flex-wrap:wrap}
.bo-dchip{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;
  background:var(--ice);color:var(--blue);padding:2px 8px;border-radius:5px;letter-spacing:.3px}
.bo-dmax{text-align:right;min-width:60px}
.bo-dmaxn{font-family:'JetBrains Mono',monospace;font-size:19px;font-weight:700;line-height:1}
.bo-dmaxl{font-size:8.5px;color:var(--dim);font-weight:600;letter-spacing:.3px}
.bo-dbody{max-height:0;overflow:hidden;transition:max-height .4s ease}
.bo-dbody.open{max-height:8000px}
.bo-ped{display:grid;grid-template-columns:52px 1fr 90px;align-items:center;gap:12px;
  padding:9px 18px 9px 36px;border-top:1px solid var(--line2);transition:background .12s}
.bo-ped:hover{background:#FAFCFE}
.bo-age-n{font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:700;line-height:1}
.bo-age-l{font-size:8px;color:var(--dim);font-weight:600;letter-spacing:.2px}
.bo-fol{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--blue);font-weight:600}
.bo-fecha{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--dim);margin-top:2px}
.bo-obs{font-size:11px;color:var(--mut);line-height:1.4}

.empty{padding:38px;text-align:center;color:var(--mut);font-size:12.5px}
.empty b{display:block;color:var(--grn);font-size:16px;margin-bottom:5px;font-family:'Barlow Condensed',sans-serif}
.loading{padding:60px;text-align:center;color:var(--dim);font-size:13px}

.modal{display:none;position:fixed;inset:0;background:rgba(4,44,83,.45);backdrop-filter:blur(4px);
  z-index:100;align-items:center;justify-content:center;padding:24px}
.modal.on{display:flex}
.mbox{background:var(--card);border-radius:14px;max-width:620px;width:100%;max-height:82vh;
  overflow:auto;box-shadow:0 20px 60px rgba(4,44,83,.3)}
.mbox-h{padding:17px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;
  justify-content:space-between;position:sticky;top:0;background:var(--card)}
.mbox-t{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;color:var(--navy)}
.mbox-s{font-size:11px;color:var(--dim);margin-top:2px}
.mx{width:28px;height:28px;border-radius:7px;border:1px solid var(--line);background:none;
  color:var(--mut);cursor:pointer;font-size:15px}
.mx:hover{border-color:var(--red);color:var(--red)}
.mbox-b{padding:18px 22px}
.mstat{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:16px}
.ms{background:var(--ice);border-radius:9px;padding:11px 13px;text-align:center}
.ms-n{font-family:'JetBrains Mono',monospace;font-size:19px;font-weight:700;color:var(--navy)}
.ms-l{font-size:8.5px;color:var(--dim);font-weight:600;letter-spacing:.4px;margin-top:2px;text-transform:uppercase}
.msec{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;text-transform:uppercase;
  letter-spacing:1.1px;color:var(--mut);margin:16px 0 4px;display:flex;align-items:center;gap:9px}
.msec:first-child{margin-top:0}
.msec .rule{flex:1;height:1px;background:var(--line)}
.mbtn{display:inline-block;margin-top:14px;background:var(--deep);color:#fff;text-decoration:none;
  font-size:12.5px;font-weight:600;padding:10px 16px;border-radius:8px}
.mbtn:hover{background:var(--blue)}

@media(max-width:760px){
  header{flex-wrap:wrap;gap:10px;padding:12px 16px}
  .hspace{display:none}
  main{padding:16px 14px 50px}
  .strip{padding:15px 16px}
  .strip-main{font-size:20px}
  .tabbar{padding:0 14px;overflow-x:auto}
  .dcards{grid-template-columns:1fr}
  .mstat{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>

  <img class="logo" id="logoimg" src="" alt="Foton">
  <div class="hdiv"></div>
  <div class="htitle">

    <div class="t2">SEGMENTO MDT / LDT · CICLO DÍA 1 / DÍA 2</div>

  <div class="hspace"></div>
  <a class="navlink" href="/foton-os/reporte-campo.html">Reporte de campo →</a>

</header>

<div class="tabbar">

  <button class="tab" id="tab-pend" onclick="setTab('pend')">Pendientes <span class="tbadge" id="bpend">0</span></button>

</div>

<div class="strip" id="strip"></div>

<main>
  <div id="pane-sem"></div>
  <div id="pane-pend" style="display:none"></div>
  <div id="pane-vend" style="display:none"></div>
</main>

<div class="modal" id="modal" onclick="if(event.target===this)cerrarModal()">
  <div class="mbox" id="mbox"></div>
</div>

let ROWS=[], BO=[], TAB='sem';

function parseF(s){if(!s)return 0;const p=String(s).split('/');
  return p.length===3?new Date(+p[2],+p[1]-1,+p[0]).getTime():0}
function diasDesdeFecha(s){const t=parseF(s);return t?Math.round((Date.now()-t)/86400000):null}
function diasDesdeISO(s){if(!s)return null;const t=new Date(s+'T00:00:00').getTime();
  return Math.round((Date.now()-t)/86400000)}
function ageColor(d){if(d>60)return'rojo';if(d>15)return'amarillo';return'verde'}

function estado(r){
  const sinVendedor = !r.vendedor_id;
  const pendAbiertos = r.pendientes_abiertos||0;
  const diasMax = r.dias_pendiente_max||0;
  const d1 = diasDesdeISO(r.ultimo_dia1), d2 = diasDesdeISO(r.ultimo_dia2);
  const sinCiclo = d1===null && d2===null;
  if(sinVendedor || sinCiclo || diasMax>30 || pendAbiertos>15) return 'rojo';
  const cicloViejo=(d1!==null&&d1>8)||(d2!==null&&d2>8);
  const metaBaja=(r.contactos_semana||0)<(r.meta_contactos||3);
  if(cicloViejo || diasMax>15 || metaBaja || pendAbiertos>5) return 'amarillo';
  return 'verde';
}

    </div>
    <div class="strip-kpis">
      <div class="sk"><div class="sk-n">${c.rojo}</div><div class="sk-l">Atención</div></div>
      <div class="sk"><div class="sk-n">${c.amarillo}</div><div class="sk-l">Seguimiento</div></div>
      <div class="sk"><div class="sk-n">${c.verde}</div><div class="sk-l">Al día</div></div>
    </div>`;
}

function renderSemaforo(){
  const cont=document.getElementById('pane-sem');
  let vis = filtro==='todos' ? ROWS : ROWS.filter(r=>estado(r)===filtro);
  vis = [...vis].sort((a,b)=>{const o={rojo:0,amarillo:1,verde:2};return o[estado(a)]-o[estado(b)]});

  const filtros = `<div class="filters">
    <button class="fbtn ${filtro==='todos'?'on':''}" onclick="setFiltro('todos')">Todos (${ROWS.length})</button>
    <button class="fbtn ${filtro==='rojo'?'on':''}" onclick="setFiltro('rojo')">Atención</button>
    <button class="fbtn ${filtro==='amarillo'?'on':''}" onclick="setFiltro('amarillo')">Seguimiento</button>
    <button class="fbtn ${filtro==='verde'?'on':''}" onclick="setFiltro('verde')">Al día</button>
  </div>`;

  if(vis.length===0){
    cont.innerHTML = filtros + `<div class="empty"><b>Nada aquí</b>Prueba con otro filtro.</div>`;
    return;
  }

  cont.innerHTML = filtros + `<div class="dcards">${vis.map(r=>{
    const est=estado(r);
    const d1=diasDesdeISO(r.ultimo_dia1), d2=diasDesdeISO(r.ultimo_dia2);
    const pills=[];
    if(!r.vendedor_id){ pills.push(`<span class="pill c">Sin vendedor</span>`); }
    else{
      const cp = r.estado_certificacion==='certificado'?'g':(r.estado_certificacion==='en_proceso'?'u':'c');
      pills.push(`<span class="pill ${cp}">${r.vendedor_nombre}</span>`);
      const mp = (r.contactos_semana||0)>=(r.meta_contactos||3) ? 'g':'u';
      pills.push(`<span class="pill ${mp}">${r.contactos_semana||0}/${r.meta_contactos||3} contactos</span>`);
    }
    if((r.pendientes_abiertos||0)>0){
      const pc = r.dias_pendiente_max>30?'c':(r.dias_pendiente_max>15?'u':'b');
      pills.push(`<span class="pill ${pc}">${r.pendientes_abiertos} pend. · ${r.dias_pendiente_max||0}d</span>`);
    } else { pills.push(`<span class="pill g">Sin pendientes</span>`); }
    pills.push(d1===null? `<span class="pill c">Sin Día 1</span>` : `<span class="pill ${d1>8?'u':'n'}">Día 1: ${d1}d</span>`);
    pills.push(d2===null? `<span class="pill c">Sin Día 2</span>` : `<span class="pill ${d2>8?'u':'n'}">Día 2: ${d2}d</span>`);

    return `<div class="dcard st-${est}" onclick="abrirModal('${r.distribuidor_id}')">
      <div class="dc-top">
        <div><div class="dc-name">${r.nombre}</div><div class="dc-plaza">${r.plaza||''}</div></div>
        <div class="dc-dot ${est}"></div>
      </div>
      <div class="dc-pills">${pills.join('')}</div>
    </div>`;
  }).join('')}</div>`;
}

function renderVendedores(){
  const cont=document.getElementById('pane-vend');
  const conVendedor = ROWS.filter(r=>r.vendedor_id);
  document.getElementById('bvend').textContent = conVendedor.length;
  if(conVendedor.length===0){
    cont.innerHTML = `<div class="empty"><b>Sin vendedores asignados</b>Aún no hay vendedores especialistas designados.</div>`;
    return;
  }
  cont.innerHTML = `<div class="panel"><table class="vtable">
    <tr><th>Vendedor</th><th>Distribuidor</th><th>Certificación</th><th>Contactos sem.</th><th>Desde</th></tr>
    ${conVendedor.map(r=>{
      const cp = r.estado_certificacion==='certificado'?'g':(r.estado_certificacion==='en_proceso'?'u':'c');
      const mp = (r.contactos_semana||0)>=(r.meta_contactos||3) ? 'g':'u';
      return `<tr>
        <td class="nm">${r.vendedor_nombre}</td>
        <td>${r.nombre}<div class="sub">${r.plaza||''}</div></td>
        <td><span class="pill ${cp}">${r.estado_certificacion}</span></td>
        <td><span class="pill ${mp}">${r.contactos_semana||0}/${r.meta_contactos||3}</span></td>
        <td class="mono">${r.fecha_designacion||''}</td>
      </tr>`;
    }).join('')}
  </table></div>`;
}

function renderPendientes(){
  const cont=document.getElementById('pane-pend');
  const porDist={};
  BO.forEach(b=>{ (porDist[b.distribuidor_id] = porDist[b.distribuidor_id]||[]).push(b); });
  const ids = Object.keys(porDist).sort((a,b)=>{
    const maxA = Math.max(...porDist[a].map(x=>diasDesdeFecha(x.fecha_solicitud)||0));
    const maxB = Math.max(...porDist[b].map(x=>diasDesdeFecha(x.fecha_solicitud)||0));
    return maxB - maxA;
  });
  document.getElementById('bpend').textContent = BO.length;

  if(ids.length===0){
    cont.innerHTML = `<div class="empty"><b>Sin pendientes abiertos</b>Toda la red está al día en back order.</div>`;
    return;
  }

  cont.innerHTML = `<div class="panel">${ids.map(id=>{
    const dist = ROWS.find(r=>r.distribuidor_id===id);
    const items = porDist[id].sort((a,b)=>(diasDesdeFecha(b.fecha_solicitud)||0)-(diasDesdeFecha(a.fecha_solicitud)||0));
    const maxD = Math.max(...items.map(x=>diasDesdeFecha(x.fecha_solicitud)||0));
    const did = 'bo_'+id;
    return `<div class="bo-dealer">
      <div class="bo-dh" onclick="toggleBO('${did}')">
        <div><div class="bo-dn">${dist?dist.nombre:id}</div><div class="bo-dr">${dist?dist.plaza:''}</div></div>
        <div class="bo-dsummary"><span class="bo-dchip">${items.length}</span></div>
        <div class="bo-dmax"><div class="bo-dmaxn" style="color:${maxD>30?'var(--red)':(maxD>15?'var(--amb)':'var(--blue)')}">${maxD}</div><div class="bo-dmaxl">DÍAS MÁX</div></div>
      </div>
      <div class="bo-dbody" id="${did}">
        ${items.map(it=>{
          const d = diasDesdeFecha(it.fecha_solicitud)||0;
          const col = d>60?'var(--red)':(d>15?'var(--amb)':'var(--blue)');
          return `<div class="bo-ped">
            <div style="text-align:center"><div class="bo-age-n" style="color:${col}">${d}</div><div class="bo-age-l">DÍAS</div></div>
            <div><div style="font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;color:var(--navy)">${it.modelo||'Sin modelo'}</div>
              ${it.obs?`<div class="bo-obs">${it.obs}</div>`:''}
            </div>
            <div style="text-align:right"><div class="bo-fol">${it.folio||''}</div><div class="bo-fecha">${it.fecha_solicitud||''}</div></div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }).join('')}</div>`;
}

function toggleBO(id){
  document.getElementById(id).classList.toggle('open');
}

function setFiltro(f){ filtro=f; renderSemaforo(); }

function setTab(t){
  TAB=t;
  ['sem','pend','vend'].forEach(x=>{
    document.getElementById('tab-'+x).classList.toggle('on', x===t);
    document.getElementById('pane-'+x).style.display = x===t?'block':'none';
  });
}

function abrirModal(id){
  const r = ROWS.find(x=>x.distribuidor_id===id);
  if(!r) return;
  const items = BO.filter(b=>b.distribuidor_id===id).sort((a,b)=>(diasDesdeFecha(b.fecha_solicitud)||0)-(diasDesdeFecha(a.fecha_solicitud)||0));
  const d1=diasDesdeISO(r.ultimo_dia1), d2=diasDesdeISO(r.ultimo_dia2);

  document.getElementById('mbox').innerHTML = `
    <div class="mbox-h">
      <div><div class="mbox-t">${r.nombre}</div><div class="mbox-s">${r.plaza||''}</div></div>
      <button class="mx" onclick="cerrarModal()">✕</button>
    </div>
    <div class="mbox-b">
      <div class="mstat">
        <div class="ms"><div class="ms-n">${r.pendientes_abiertos||0}</div><div class="ms-l">Pendientes</div></div>
        <div class="ms"><div class="ms-n">${r.dias_pendiente_max||0}</div><div class="ms-l">Días máx.</div></div>
        <div class="ms"><div class="ms-n">${d1===null?'—':d1+'d'}</div><div class="ms-l">Último Día 1</div></div>
        <div class="ms"><div class="ms-n">${d2===null?'—':d2+'d'}</div><div class="ms-l">Último Día 2</div></div>
      </div>

      <div class="msec">Vendedor especialista<span class="rule"></span></div>
      ${r.vendedor_id ? `<div style="font-size:13px">${r.vendedor_nombre} · <span class="pill ${r.estado_certificacion==='certificado'?'g':(r.estado_certificacion==='en_proceso'?'u':'c')}">${r.estado_certificacion}</span> · ${r.contactos_semana||0}/${r.meta_contactos||3} contactos esta semana</div>`
        : `<div style="font-size:13px;color:var(--red)">Sin vendedor designado todavía.</div>`}

      <div class="msec">Pendientes abiertos<span class="rule"></span></div>
      ${items.length===0 ? `<div style="font-size:12.5px;color:var(--dim)">Sin pendientes.</div>` :
        items.map(it=>{
          const d=diasDesdeFecha(it.fecha_solicitud)||0;
          const col = d>60?'var(--red)':(d>15?'var(--amb)':'var(--blue)');
          return `<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line2);font-size:12px">
            <span>${it.modelo||'Sin modelo'} ${it.folio?'· '+it.folio:''}</span>
            <span class="mono" style="color:${col};font-weight:700">${d}d</span>
          </div>`;
        }).join('')}

      <a class="mbtn" href="/foton-os/reporte-campo.html" target="_blank">Abrir reporte de campo →</a>
    </div>`;
  document.getElementById('modal').classList.add('on');
}
function cerrarModal(){ document.getElementById('modal').classList.remove('on'); }

async function cargar(){
  document.getElementById('btnr').classList.add('load');
  document.getElementById('pane-sem').innerHTML = `<div class="loading">Cargando panel…</div>`;
  try{
    const [rows, bo] = await Promise.all([
      q('/v_panel_seguimiento?select=*'),
      q('/back_order?resuelto=eq.false&select=id,distribuidor_id,modelo,folio,fecha_solicitud,obs')
    ]);
    ROWS = rows; BO = bo;
    renderStrip();
    renderSemaforo();
    renderPendientes();
    renderVendedores();
  }catch(e){
    document.getElementById('pane-sem').innerHTML = `<div class="empty">Error al cargar: ${e.message}</div>`;
  }
  document.getElementById('btnr').classList.remove('load');
}

document.getElementById('logoimg').src = LOGO_DATAURI;
cargar();
</script>
</body>
</html>
