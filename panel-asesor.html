<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mi Panel · Vendedor Especialista Foton</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F7FB; --card:#FFFFFF; --ice:#EEF5FD;
  --deep:#002870; --navy:#042C53; --blue:#185FA5; --sky:#4A90D9;
  --ink:#1B2733; --mut:#5B6B7C; --dim:#8496A8;
  --line:#D6E4F2; --line2:#E8EFF7;
  --red:#C0392B; --red-bg:#FBEAE7;
  --amb:#C47A1A; --amb-bg:#FDF3E3;
  --grn:#1E8E5A; --grn-bg:#E2F4EA;
  --pur:#8E44AD; --pur-bg:#F5EEF8;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:40px}
.mono{font-family:'JetBrains Mono',monospace}
header{background:linear-gradient(180deg,#00214F,var(--deep));padding:18px 20px 16px;display:flex;align-items:center;gap:12px}
.logo{height:22px}
.htitle .t1{font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:700;color:#fff;line-height:1}
.htitle .t2{font-size:9px;color:rgba(255,255,255,.55);letter-spacing:1.2px;font-weight:600;margin-top:3px}

.screen{max-width:480px;margin:0 auto;padding:20px 18px}
h1{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:700;color:var(--navy);margin:0 0 4px}
.sub{font-size:12.5px;color:var(--mut);margin:0 0 22px;line-height:1.4}
label{display:block;font-size:11.5px;color:var(--mut);font-weight:600;margin:16px 0 6px;text-transform:uppercase;letter-spacing:.4px}
input{width:100%;background:var(--card);border:1px solid var(--line);color:var(--ink);
  border-radius:10px;padding:12px 14px;font-size:16px;min-height:46px;font-family:Inter}
input:focus{outline:2px solid var(--blue);border-color:var(--blue)}
.pin-input{letter-spacing:8px;font-size:24px;text-align:center;font-weight:700;font-family:'JetBrains Mono',monospace}
button, .btnlink{display:block;width:100%;min-height:48px;border:none;border-radius:10px;font-size:14.5px;font-weight:600;
  margin-top:18px;cursor:pointer;font-family:Inter;text-align:center;text-decoration:none;line-height:48px}
.btn-primary{background:var(--deep);color:#fff}
.btn-primary:hover{background:var(--blue)}
.btn-secondary{background:var(--card);border:1px solid var(--line);color:var(--navy)}
.hidden{display:none}
.error-msg{color:var(--red);font-size:12px;margin-top:10px;display:none}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(4,44,83,.05)}
.welcome .name{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;color:var(--navy)}
.welcome .plaza{font-size:11.5px;color:var(--dim);margin-top:2px}
.welcome .pill{display:inline-block;margin-top:8px;padding:3px 9px;border-radius:6px;font-size:11px;font-weight:600}
.pill.g{background:var(--grn-bg);color:var(--grn)}
.pill.u{background:var(--amb-bg);color:var(--amb)}
.pill.c{background:var(--red-bg);color:var(--red)}

.kpi-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--ice);border-radius:10px;padding:12px;text-align:center}
.kpi-n{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:800;color:var(--navy);line-height:1}
.kpi-l{font-size:9.5px;color:var(--dim);font-weight:600;letter-spacing:.4px;text-transform:uppercase;margin-top:4px}

.progress-wrap{margin-top:10px}
.progress-bar{height:8px;background:var(--line2);border-radius:4px;overflow:hidden}
.progress-fill{height:100%;border-radius:4px;transition:width .4s ease}
.progress-lbl{display:flex;justify-content:space-between;font-size:10.5px;color:var(--dim);margin-top:5px;font-weight:600}

.msec{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;text-transform:uppercase;
  letter-spacing:1.1px;color:var(--mut);margin:0 0 10px}

.steps{display:flex;flex-direction:column;gap:0}
.step{display:flex;gap:12px;position:relative;padding-bottom:16px}
.step:last-child{padding-bottom:0}
.step-line{position:absolute;left:11px;top:24px;bottom:0;width:2px;background:var(--line)}
.step:last-child .step-line{display:none}
.step-dot{width:24px;height:24px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;font-family:'JetBrains Mono',monospace;z-index:1}
.step-dot.done{background:var(--grn);color:#fff}
.step-dot.current{background:var(--blue);color:#fff;box-shadow:0 0 0 4px var(--blu-bg,#EEF5FD)}
.step-dot.pending{background:var(--line2);color:var(--dim)}
.step-body{flex:1;padding-top:1px}
.step-t{font-size:13px;font-weight:600;color:var(--navy)}
.step-d{font-size:11px;color:var(--dim);margin-top:2px;line-height:1.35}
.step.current .step-t{color:var(--blue)}

.pend-item{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line2);font-size:12px}
.pend-item:last-child{border-bottom:0}
</style>
</head>
<body>

<header>
  <img class="logo" id="logoimg" src="" alt="Foton">
  <div class="htitle"><div class="t1">Mi Panel</div><div class="t2">VENDEDOR ESPECIALISTA MDT / LDT</div></div>
</header>

<div class="screen">

  <div id="paso-pin">
    <h1>Entrar</h1>
    <p class="sub">Ingresa el PIN de tu distribuidor para ver tu avance.</p>
    <label for="pin">PIN (6 dígitos)</label>
    <input id="pin" class="pin-input mono" inputmode="numeric" maxlength="6" placeholder="••••••">
    <button class="btn-primary" onclick="validarPin()">Entrar</button>
    <p class="error-msg" id="pin-error"></p>
  </div>

  <div id="paso-panel" class="hidden"></div>

</div>

const SB_URL='https://gblwoaaitnqbgorxaydv.supabase.co/rest/v1';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdibHdvYWFpdG5xYmdvcnhheWR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxOTQ3NTMsImV4cCI6MjA5NTc3MDc1M30.o7zYCCfH2rHEs69o4U7Zc9dM4IvQi8GsXRlZFW_2kso';
const H={apikey:KEY,Authorization:'Bearer '+KEY};

const RUTA=[
  {t:'Producto', d:'Ficha técnica S3–S12 AMT: capacidades, motorización, ventajas por aplicación.'},
  {t:'Argumentario', d:'Comparativo vs. competencia y manejo de objeciones autorizado.'},
  {t:'Financiero', d:'Esquemas Banorte, Atlas, TIP, Solufi — cómo armar una propuesta de crédito.'},
  {t:'Acompañamiento', d:'Cierre real en campo junto al gerente regional.'}
];

async function get(path){const r=await fetch(SB_URL+path,{headers:H});if(!r.ok)throw new Error(r.status);return r.json()}
function diasDesde(s){if(!s)return null;const p=String(s).split('/');
  if(p.length===3){const t=new Date(+p[2],+p[1]-1,+p[0]).getTime();return Math.round((Date.now()-t)/86400000)}
  const t=new Date(s+'T00:00:00').getTime(); return t?Math.round((Date.now()-t)/86400000):null}

async function validarPin(){
  const pin=document.getElementById('pin').value.trim();
  const err=document.getElementById('pin-error'); err.style.display='none';
  if(pin.length!==6){ err.textContent='El PIN debe tener 6 dígitos.'; err.style.display='block'; return; }
  try{
    const dist=await get('/distribuidores?select=id,nombre,plaza&pin=eq.'+pin);
    if(!dist||dist.length===0){ err.textContent='PIN no reconocido. Verifica con tu gerente regional.'; err.style.display='block'; return; }
    const d=dist[0];
    const ve=await get('/vendedores_especialistas?distribuidor_id=eq.'+d.id+'&activo=eq.true&select=*');
    const pend=await get('/back_order?distribuidor_id=eq.'+d.id+'&resuelto=eq.false&select=id,fecha_solicitud,modelo');
    renderPanel(d, ve[0]||null, pend);
  }catch(e){ err.textContent='Error de conexión. Intenta de nuevo.'; err.style.display='block'; }
}

function renderPanel(dist, ve, pend){
  document.getElementById('paso-pin').classList.add('hidden');
  const p=document.getElementById('paso-panel');
  p.classList.remove('hidden');

  if(!ve){
    p.innerHTML = `
      <div class="card">
        <div class="welcome"><div class="name">${dist.nombre}</div><div class="plaza">${dist.plaza||''}</div></div>
        <p class="sub" style="margin-top:12px">Todavía no hay un vendedor especialista designado para este distribuidor. Pídele a tu gerente regional o a tu distribuidor que te registre en el reporte de campo.</p>
      </div>
      <a class="btnlink btn-primary" href="/foton-os/reporte-campo.html">Ir a Reporte de Campo →</a>
    `;
    return;
  }

  const semana = Math.min(Math.max(ve.semana_programa||1,1),4);
  const certPill = ve.estado_certificacion==='certificado'?'g':(ve.estado_certificacion==='en_proceso'?'u':'c');
  const contactosPct = Math.min(100, Math.round(100*(ve.contactos_semana||0)/(ve.meta_contactos||3)));
  const contactosColor = contactosPct>=100?'var(--grn)':(contactosPct>=50?'var(--amb)':'var(--red)');

  const pendOrdenado = [...pend].sort((a,b)=>(diasDesde(b.fecha_solicitud)||0)-(diasDesde(a.fecha_solicitud)||0));
  const maxDias = pendOrdenado.length ? (diasDesde(pendOrdenado[0].fecha_solicitud)||0) : 0;

  p.innerHTML = `
    <div class="card">
      <div class="welcome">
        <div class="name">${ve.nombre}</div>
        <div class="plaza">${dist.nombre} · ${dist.plaza||''}</div>
        <span class="pill ${certPill}">${ve.estado_certificacion}</span>
      </div>
    </div>

    <div class="card">
      <div class="msec">Esta semana</div>
      <div class="kpi-row">
        <div class="kpi"><div class="kpi-n">${ve.contactos_semana||0}/${ve.meta_contactos||3}</div><div class="kpi-l">Contactos</div></div>
        <div class="kpi"><div class="kpi-n">${pendOrdenado.length}</div><div class="kpi-l">Pendientes dist.</div></div>
      </div>
      <div class="progress-wrap">
        <div class="progress-bar"><div class="progress-fill" style="width:${contactosPct}%;background:${contactosColor}"></div></div>
        <div class="progress-lbl"><span>Meta de contactos</span><span>${contactosPct}%</span></div>
      </div>
    </div>

    <div class="card">
      <div class="msec">Tu ruta de desarrollo</div>
      <div class="steps">
        ${RUTA.map((r,i)=>{
          const n=i+1;
          const cls = n<semana ? 'done' : (n===semana ? 'current' : 'pending');
          const icon = cls==='done' ? '✓' : n;
          return `<div class="step ${cls}">
            <div class="step-line"></div>
            <div class="step-dot ${cls}">${icon}</div>
            <div class="step-body"><div class="step-t">Semana ${n} · ${r.t}</div><div class="step-d">${r.d}</div></div>
          </div>`;
        }).join('')}
      </div>
    </div>

    ${pendOrdenado.length>0 ? `
    <div class="card">
      <div class="msec">Pendientes del distribuidor ${maxDias>15?'<span class="pill c" style="margin-left:6px">'+maxDias+'d máx.</span>':''}</div>
      ${pendOrdenado.slice(0,5).map(x=>{
        const d=diasDesde(x.fecha_solicitud)||0;
        return `<div class="pend-item"><span>${x.modelo||'Sin modelo'}</span><span class="mono" style="font-weight:700;color:${d>30?'var(--red)':(d>15?'var(--amb)':'var(--blue)')}">${d}d</span></div>`;
      }).join('')}
      ${pendOrdenado.length>5?`<p class="sub" style="margin:8px 0 0">+${pendOrdenado.length-5} más — repórtalos en Día 1.</p>`:''}
    </div>` : ''}

    <a class="btnlink btn-primary" href="/foton-os/reporte-campo.html">Reportar Día 1 / Día 2 →</a>
  `;
}

document.getElementById('pin').addEventListener('keypress',e=>{ if(e.key==='Enter') validarPin(); });
document.getElementById('logoimg').src = LOGO_DATAURI;
</script>
